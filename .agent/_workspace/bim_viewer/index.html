<script id="payload" type="application/json">{"docs": [{"id": "00_overview", "title": "Overview & research", "md": "# Web BIM viewer / `wgpu_renderer` \u2014 working set\n\nEverything produced in the 2026-07-29 session, in reading order. Diagrams are under\n**Diagrams** in the sidebar.\n\n| Doc | What it answers |\n| --- | --- |\n| Audit | What `tools/wgpu_renderer` actually is, and where it stands against the BIM plan. Every claim has a `file:line`. |\n| Semantic layer | How click-to-data gets built, and why most of it already exists one layer up in Python. |\n| Large models | What actually limits big models. Two corrections to the audit. |\n| Jira journey | Epic AKS-18576's 34 children, the AKS-18641 picking decisions, and the ticket list. |\n| Benchmark & limits | The synthetic benchmark design, and the 100 GB maths. |\n| Instancing & merging | Plan step 5 unpacked, with the proposed code. Not applied. |\n| Research | The original conclusions, plan and misconceptions list. |\n\n## The short version\n\n1. The crate is a **FEA result viewer**, not a scene graph. It solves the pre-tessellation and\n   transport half of the BIM plan and none of the semantic or \"load less\" halves.\n2. It runs **WebGL2**, not WebGPU \u2014 `use_webgl = true` is a hardcoded local, not a cfg.\n3. Per-element **identity already exists** upstream: `pick_ref` \u2192 `pick_color_map` \u2192\n   `PickRenderStage` items whose colour *is* the id. Two lines throw it away. But today's\n   exports may carry no pick items at all, which is a blocking prerequisite.\n4. The wall for large models is the **load path**, not the renderer: peak residency is ~3x the\n   geometry in wasm32 linear memory against a 4 GB cap.\n5. A **100 GB model is ~100x past three independent walls** (network time, residency, draw\n   calls). It needs the resident set decoupled from model size. The benchmark's job is to\n   measure each wall so the tiling budget follows from data.\n"}, {"id": "01_explorer_wgpu_bim_gap", "title": "Audit: crate vs BIM plan", "md": "# 01 \u2014 Explorer: `tools/wgpu_renderer` vs. Web-BIM-Viewer plan (gap map)\n\nProduced by the `wgpu_orchestrator` team pattern (3 \u00d7 `wgpu-explorer`, read-only) on 2026-07-29.\nInputs: `BIM_VIEWER_PLAN.csv`, `SUMMARY.md`, `MISCONCEPTIONS_AND_FAQ.md` (copies in this folder).\nTarget: `E:\\akselos-dev-3.10\\akselos-dev-2\\tools\\wgpu_renderer` (Rust + wgpu 27 + WGSL, native + wasm32).\nAll `file:line` are relative to that crate unless prefixed.\n\n---\n\n## 0. WARP graph drift (graphify-out is stale)\n\n`src/graphify-out/GRAPH_REPORT.md` is dated **2026-05-19**; `src/` was modified through **2026-07-15**. Verified drift \u2014 trust source, not the graph:\n\n| Graph claims | Reality |\n|---|---|\n| `GizmoStage` is a god node | Gone. `src/custom_layer/` holds only `mod.rs` + `sensor_stage.rs`. |\n| `VisibilityConfig` in the config community | Gone. `renderer_config.rs:1-45` has `WgpuRendererConfig`, `ColorBarConfig`, `TriadConfig`, `TriadLabels`, `DisplayConfig`. |\n| `read_render_groups() \u2192 fetch_bytes()` (\"surprising connection\") | `read_render_groups` deleted; replaced by `RenderDataLoader::new` (`src/web_app.rs:628`) fed bytes from JS. |\n| `pipelines.rs` (`BGL`/`PipelineSet`/`PipelineFormats`/`ShaderModules`) is live architecture | **Orphaned file.** Not declared in `lib.rs:6-30`, referenced by nothing. Contains a *complete* pick pipeline (`pipelines.rs:410-435`) + highlight/selection blend pipelines (`:386-408`) that are never compiled. |\n| `brute_transform_bounding_box`, `combine_boxes` are API | `#[cfg(test)]` items (`bounding_box.rs:94-107`, `:214`). |\n\n\u2192 **Re-run `/update_warp` on `tools/wgpu_renderer/src` before relying on the graph again.**\n\n## 1. What the crate actually is\n\nA **FEA result viewer**, not a scene graph. Server pre-tessellates in Python (headless HUI Modeler under Xvfb \u2014 `wgpu_data_utils/helper_functions.py:20-80`, `worker.py:21-217`) into Avro descriptor + raw f32/u16/u32 binary blobs (`tools/gl_graphics/remote_render_list.py:13-98` \u2194 `src/render_list.rs:37-73`), chunked to 8 MiB `.partNNN` + MD5 (`worker.py:242-285`). Browser fetches chunks 6-way parallel (`loadRenderData.util.ts:100`), pushes them into wasm (`web_app.rs:686`), concatenates, and creates ~3 big GPU buffers (VERTEX / INDEX / scalar) via `create_buffer_init` (`render_list.rs:320-346`). Draw = one `draw_indexed(.., 0..1)` per `RenderItem`, baked once into immutable render bundles.\n\nSo: **the \"server pre-tessellation + streamable chunk\" half of the BIM plan already exists.** The \"queryable semantic model\" half does not exist at all, and the \"loading LESS\" half (culling/LOD/eviction) does not exist at all.\n\n## 2. Capability audit against the plan (CSV step \u2192 status)\n\n| Plan step | Status in `wgpu_renderer` | Anchor |\n|---|---|---|\n| 1 Render in browser | **PRESENT** (WebGL2, see \u00a73) | `web_app.rs:742-759`, `wgpu_renderer.rs:297-322` |\n| 2 Semantic tree + click-to-data | **ABSENT \u2014 biggest gap.** `GraphicsItem` is a zero-sized geometry-factory namespace (`graphics_item.rs:75`). `RenderItem` carries only *array* ids (`render_list.rs:45-58`); `ItemKey` deliberately **merges** items sharing (transform-id, colour) to dedupe bind groups (`render_list.rs:432-457`) \u2014 identity is destroyed by design. No parent/child anywhere; `RenderMap`'s 4-level nesting is draw-bucketing (`render_list.rs:115-131`). | \u2014 |\n| 3 Query/filter/aggregate | ABSENT. No name\u2192item or id\u2192item lookup on `RenderList` (`render_list.rs:133-143`); after bundling, items aren't addressable at draw time (`shaded_stage.rs:190-206`). | \u2014 |\n| 4 Dashboards/schedules | ABSENT (host-side concern; only `on_layout`/`on_bounds` callbacks exist, `web_app.rs:71-75`). | \u2014 |\n| 5 Instancing + merging | **PARTIAL.** Geometry *is* merged into shared per-`BufferType` buffers (`render_list.rs:172-249`) and bind groups deduped (`:486-534`), but **zero 3D instancing** \u2014 every `draw_indexed` is `0..1` (`shaded_stage.rs:200`, `scalar_field_stage.rs:358`, `translucent_stage.rs:182`, `sensor_stage.rs:351`, `triad_stage.rs:607`). Only 2D label rects instance (`overlay_pass.rs:125,296`). Draw ranges of adjacent items sharing pipeline+buffers are never merged, and `set_vertex_buffer(1, ..)` is re-issued *inside* the per-item loop (`shaded_stage.rs:194-197`). | \u2014 |\n| 6 Frustum culling | ABSENT. No plane rejection; bundles are immutable + camera-independent so per-frame culling is structurally impossible without rebuilding them (`wgpu_renderer.rs:738-774`, only caller `graphics_window.rs:44` = once at load). `RenderItem.should_clip` and `.primitive_size` are deserialized and never read (`render_list.rs:53-54`). | \u2014 |\n| 7 Occlusion culling | ABSENT. `occlusion_query_set: None` in all 7 passes; no depth pre-pass \u2014 `shaded_stage.rs:133` in fact **clears depth mid-frame**. | \u2014 |\n| 8 LOD chain / proxies | ABSENT. No LOD/decimation/SSE/mip; `RenderItem` has one index range, no tier; sphere/cone segment counts are compile-time consts (`sensor_stage.rs:16`). | \u2014 |\n| 9 SSE LOD selection | ABSENT. Only screen-size *transform* scaling for sensors/triad (`sensor_stage.rs:181-233`, `triad_stage.rs:256-320`). | \u2014 |\n| 10 Server-side tessellation | **PRESENT \u2014 reusable as-is.** | `worker.py:168-217`, `remote_render_list.py:130-195` |\n| 11 Spatial streaming + LRU | **PARTIAL/ABSENT.** Chunking is a *parallel-download* trick, not streaming: `finalize_chunks` hard-fails unless every chunk landed (`web_app.rs:705-713`), nothing renders before the last byte. No tiles/octree \u2014 one global bbox (`render_list.rs:141`). `id_to_buffer` is insert-only (`:341`, `:697`); the only free is dropping a whole window (`web_app.rs:328`). | \u2014 |\n| 12 RTC / double precision | ABSENT. f32 everywhere: `Vertex.xyz:[f32;3]` (`graphics_item.rs:61`), `Transformation{Quat,Vec3,f32}` (`point.rs:4-9`); `Dtype` can't even express f64 (`render_list.rs:27-32`) and `validate_arrays` rejects non-Float32 vertices (`:617-623`). Precision sink is the collapsed MVP `ndc_from_model = ndc_from_eye * eye_from_model` (`graphics_window.rs:89`) uploaded as one f32 `Mat4`. Jitter also enters via large `ItemData.model_from_local` translations (`wgpu_renderer.rs:232`) and accumulates in `CameraInfos` mul/inverse chains (`camera_infos.rs:51,105,134`, `point.rs:144-155`). Ortho + linear depth (`transformations.rs:40-62`) softens it; near/far shrink-wrap the *whole model* (`transformations.rs:25-26`) so depth resolution scales with global model size. | \u2014 |\n| 13 Decoupled loader (workers + budgeted upload) | **ABSENT \u2014 second biggest gap.** No Web Worker anywhere; `Cargo.toml:24-27` doesn't even expose `Worker` to Rust. Avro parse (`web_app.rs:634-639`), per-8-MiB `md5::compute` (`:688`), full-blob memcpy (`:715-720`) and `create_buffer_init` of the entire blob (`render_list.rs:336`) all run in **one `spawn_local` microtask** (`web_app.rs:293-318`) \u2192 render loop *and* all DOM input frozen for its duration; peak RAM \u2248 3\u00d7 geometry. Geometry never uses `queue.write_buffer` (that's uniforms only). Progress hits 100 % *before* finalize+upload (`loadRenderData.util.ts:81-84`, `WgpuCanvas.tsx:268`) so the UI says \"done\" exactly while the tab is locked. The pre-first-frame input gate is vacuous \u2014 `has_rendered` is initialised `true` and never reassigned (`wgpu_renderer.rs:526`, `graphics_window.rs:58-60`, gate at `web_app.rs:557-568`). | \u2014 |\n| 14 Local cache | ABSENT. No IndexedDB/OPFS/CacheStorage; scalar fields explicitly not cached (`render_list.rs:663-667`) \u2014 every field switch re-fetches + rebuilds the buffer + re-bundles (`web_app.rs:472`, `graphics_window.rs:444-457`). | \u2014 |\n| 15 Benchmark harness | ABSENT. `canvas_id_to_loading_progress` is written once and never read (`web_app.rs:43,281`). | \u2014 |\n| 16 NL/LLM query | ABSENT (needs step 3 first). | \u2014 |\n| 17 Prefer WebGPU | **ABSENT / actively opposed.** `let use_webgl = true;` is a **hardcoded local, not a cfg** (`wgpu_renderer.rs:297-306`) \u2192 `Backends::GL`, limits clamped to `downlevel_webgl2_defaults()` (`:322`), features `empty()` (`:328`); the `webgl` wgpu feature is unconditional (`Cargo.toml:14`). Web runs **WebGL2**, native is forced onto GL too, and the true-WebGPU branches (`:305`, `:336-345`) are dead. This also *causes* the buffer split \u2014 mixing vertex+index in one buffer is illegal on GL (`render_list.rs:174-182`). | \u2014 |\n\n## 3. Cross-cutting hazards found\n\n- **Depth ordering is broken by pass order.** Translucent draws *before* opaque with `depth_write_enabled:false` (`translucent_stage.rs:313`), then the shaded pass **clears depth** (`shaded_stage.rs:130-136`), so shaded geometry never depth-tests against scalar-field/translucent output. No back-to-front sort, no OIT; intra-bundle draw order follows `HashMap` iteration (`render_list.rs:119`) \u2192 **nondeterministic across runs**.\n- **Per-frame CPU churn:** ~9 `Vec` + 3 `String` allocations (`wgpu_renderer.rs:880-901`, `triad_stage.rs:713`), a full `device.create_buffer` for label rects (`overlay_pass.rs:238-243`), an O(n\u00b2) `Vec::remove` label-merge fixpoint (`graphics_item.rs:690-711`), and a ~2.7 KB `Globals` rebuilt + re-uploaded from unchanged inputs every frame (`graphics_window.rs:124-126` \u2192 `wgpu_renderer.rs:709`).\n- **Silent drops:** 5 of 8 `RenderStage` variants (`Flat`, `Ghost`, `Highlight`, `Selection`, `Pick` \u2014 `render_list.rs:10-16`) are accepted by `RenderList::new` and never drawn, no warning.\n- **Panic traps:** `_get_buffer_slice` unwraps (`render_list.rs:842`) so a `ShadedRenderStage` item with `normals_id == -1` panics even though `validate_arrays` permits it (`:620`); `scalar_field_stage.rs:350` asserts `scalar_values_id > 0`.\n- **Single-slot loader race:** `SHARED_RENDER_LOADER` (`web_app.rs:731-733`) is `take()`n with `.expect` (`:747-750`); two canvases loading concurrently clobber it \u2014 JS holds it together by a comment-enforced \"no await between attach and start\" rule (`WgpuRenderer.tsx:47-51`).\n- **Stale generated bindings:** `pkg/wgpu_renderer.d.ts` (Jun 10) is an orphaned build exporting 4 functions that no longer exist (`:8,10,16,17`) and missing `RenderDataLoader`; the deployed copy under `dashboard/papps/frontends/src/library/components/wasm/wgpu_renderer/` still exports `set_on_layers`. `tools/wgpu_renderer/README.md` is stale (wrong out-dir `pkg/`, missing `library/` path segment) \u2014 the real build is `dashboard/papps/frontends/build_wgpu_renderer.py`. `TARGET_VERSION_FILE` is declared (`:18`) and never written, so the deployed wasm's source revision is unknowable.\n\n## 4. What is genuinely reusable for a BIM viewer\n\n1. **Server-side pre-tessellation + chunk/manifest/MD5 pipeline** (Python side) \u2014 matches plan step 10 and half of 11.\n2. **Coalesced per-`BufferType` buffers + `ItemKey` bind-group dedup** (`render_list.rs:154-537`) \u2014 a working batching substrate; needs draw-range merging + instancing on top.\n3. **Attribute \u2192 colour path, fully working end-to-end** (`scalar_field_stage.rs:123-137` per-vertex `ScalarValue`; LUT in `Globals` `wgpu_renderer.rs:99-110`; hot-swap `render_list.rs:662-703` \u2190 `web_app.rs:137`). Critically, the shader already has a **discrete/`is_enumerating` categorical branch** (`scalar_field_stage.rs:53-70`) that snaps to nearest bin \u2014 i.e. colouring by a BIM *category* (material / discipline / system / status) needs **no shader work**, only a value\u2194category encoding on the host.\n4. **`ColorBar` legend + React layout mirroring** (`color_bar.rs:385-424` \u2192 `web_app.rs:202-217`).\n5. **`BoundingBox` + `transform`/`mutate_combine`/`center`/`diameter`** (`bounding_box.rs:3-75`). Note `get_bounding_box_in_model` already computes a per-`(model_from_local_id, vertices_id)` box and **throws the map away** (`render_list.rs:751-767`) \u2014 retaining it is the single cheapest step toward frustum culling *and* broad-phase scene picking.\n6. **Complete CPU raycast library** (`pick_utils.rs:2-220`: cylinder/torus/quad/segment/aabb) \u2014 currently used only by the triad widget (`triad_stage.rs:355-418`); `ray_quad`/`ray_segment` have no callers. No `BoundingBox \u2192 ray_aabb` bridge exists yet (one small fn).\n7. **Orphaned `pipelines.rs`** \u2014 a ready-made design for id-buffer picking (`:410-435`, dedicated `pick_color` target + `layout_pick` + `bgl.pick`) and highlight/selection blend pipelines (`:386-408`). Worth mining rather than deleting.\n8. **`update_sensors_json`** (`web_app.rs:158-161`) \u2014 the existing pattern for \"host pushes tagged markers into the scene\"; a template for a BIM-id \u2192 marker bridge (but it replaces the whole set, no per-id addressing).\n\n## 5. Recommended order (adapts the CSV to this crate)\n\n1. **Identity first, before anything else.** Add a stable `element_id` to `RenderItem` (`render_list.rs:45`) + the Avro schema (`remote_render_list.py:13-98`), and stop letting `ItemKey` erase it. Everything in plan phases 1/2/3/5 depends on this.\n2. **Retain per-element bboxes** (`render_list.rs:751`) \u2192 unlocks frustum culling *and* picking broad-phase from one change.\n3. **Picking + `on_pick` callback:** bridge `BoundingBox \u2192 ray_aabb`, add a `pick_at(x,y)` wasm export next to the existing setters (`web_app.rs:34-171`), fire an `on_pick(element_id)` callback alongside `on_layout`/`on_bounds` (`:71-75`). Then `select_by_id` inbound + revive `HighlightRenderStage` using `pipelines.rs:386-408`.\n4. **Un-freeze the loader** (plan step 13): move avro parse + MD5 + merge off the main thread, and split `create_buffer_init` into budgeted `queue.write_buffer` slices. This is the \"two worlds on two clocks\" rule from `SUMMARY.md` \u00a76 and the one item the research flags as painful to retrofit \u2014 it is currently 100 % un-implemented.\n5. **Decide WebGL2 vs WebGPU deliberately** (`wgpu_renderer.rs:297`). The plan says WebGPU (draw-call overhead is the BIM bottleneck); the crate hardcodes GL and its buffer layout is shaped by GL's restrictions. This is a fork in the road, not a flag flip.\n6. Then instancing + draw-range merging \u2192 frustum culling \u2192 LOD/proxies (needs a new server-side LOD chain in `worker.py`) \u2192 eviction.\n\n## 6. Refusals / limits\n\n- `scrbe/` not touched (proprietary, per `wgpu_orchestrator` SKILL.md).\n- Nothing was edited; this is a read-only map.\n"}, {"id": "02_design_semantic_layer", "title": "Design: semantic layer", "md": "# 02 \u2014 Design: unblock the semantic layer in `wgpu_renderer` (BIM viewer, phase 1)\n\nFollows [01_explorer_wgpu_bim_gap.md](01_explorer_wgpu_bim_gap.md). Decision: **`wgpu_renderer` is the renderer**; the BIM plan is re-cut to fit it (\u00a74).\nWARP graph refreshed 2026-07-29 (`graphify update src` in WSL) \u2014 423 nodes / 662 edges, ghosts purged.\n\n---\n\n## 1. The find: identity already exists, one layer up\n\nThe audit said \"identity is destroyed by design\". That is true **inside the Rust crate**, but the layer that *produces* its data already has a complete, battle-tested identity + GPU-id-picking design \u2014 used today by the OpenGL desktop renderer. The wgpu path inherits the producer and silently discards its identity output.\n\n`tools/gl_graphics/render_list.py` is an abstract base with two implementations: `GlRenderList` (desktop OpenGL) and `RemoteRenderList` (the wgpu/web exporter). Everything below is in the **shared base**, i.e. it already runs on every wgpu export:\n\n| Mechanism | Site | What it gives us |\n|---|---|---|\n| `graphics_face.pick_ref` | `tools/graphics_api/graphics_face.py:7-11` | the stable per-element identity, one per pickable face |\n| `new_pick_color_association(ref, pick_color_map)` | `render_list.py:107-114` | allocates `idx` (random, 1..2\u00b2\u00b3), records `pick_color_map[idx] = ref`, returns `encode_padic(idx)` as an RGB colour |\n| pick items are emitted into the render list | `render_list.py:163-169` | for every pickable face: a **second `RenderItem` in `PickRenderStage`** whose `color` *is* the encoded id |\n| `pick_ref_map` | `render_list.py:105`, `:165-166` | `pick_ref \u2192 [(graphics_body, graphics_face, walk_data)]` |\n| `add_selection_and_highlight_items(...)` | `render_list.py:200+` | emits `Highlight`/`SelectionRenderStage` items, `HIGHLIGHT_COLOR`/`SELECTION_COLOR` at `render_list.py:88-89` |\n| hierarchy | `render_list.py:116-137` \u2014 the recursive `key_tuple` walk + `graphics_body_key_map[key_tuple]` | the Project\u2192Group\u2192Body\u2192Face **tree**, already computed |\n| attribute payload | `Pick.to_json(context)` \u2014 `tools/akselos/ui/pick.py:33-75` | ready-made JSON per element: `{'code':'Component','id':\u2026}`, `{'code':'NamedGeom','component_id':\u2026,'geom_name':\u2026}`, ports, boundary conditions, solutions, stored selections\u2026 |\n| readback+decode reference impl | `pick_info.py:61-88` (`decode_padic` `:7-12`), driven from `gl_renderer.py:676-679` | exactly the algorithm to port |\n| serialize-the-map precedent | `gl_renderer.py:29-36` `write_out_pick_color_map()` \u2192 `pick_color_map.json` | precedent for shipping the id\u2192ref map |\n\n**So the Avro that the browser downloads today already contains a per-element id for every pickable face**, encoded as the `color` of a `PickRenderStage` item. Two things throw it away:\n\n1. `wgpu_data_utils/worker.py:183` creates `pick_color_map = {}`, passes it to `RemoteRenderList.create` (which fills it in place, `remote_render_list.py:110-116`), and **never writes it out** \u2014 the `idx \u2192 pick_ref` mapping dies with the process.\n2. The Rust crate declares `PickRenderStage` (`render_list.rs:16`) but no stage filters on it (`shaded_stage.rs:167`, `translucent_stage.rs:153`, `scalar_field_stage.rs:320`), so those items are accepted by `RenderList::new` (`:561-586`) and never drawn \u2014 silently.\n\n**Cost of the pick items \u2014 CORRECTED, see [04_jira_journey_and_tickets.md](04_jira_journey_and_tickets.md) \u00a73.** `_get_array_part_dict` (`remote_render_list.py:228-237`) resolves arrays through `remember_array` (`:118-128`), which dedups by `GraphicsArray` identity, so a pick item reuses its display twin's `vertices_id`/`indices_id`/`normals_id` **only when one `GraphicsBody` carries both `draw_pick` and `draw_regular`.** The common model path instead builds a *separate* pick tree with its own geometry (`graphics_trees/graphics_group_node.py:251`), which does add bytes; and solution graphics set `draw_pick=False` entirely, so an `.asl` export may contain **no pick items at all**. Making the export carry pick items is a blocking prerequisite (ticket S2 in doc 04), not a detail.\n\nWhat does hold unconditionally: `ItemKey` (`render_list.rs:434-437`) cannot merge pick items, because their colours are unique by construction \u2014 the dedup that erases display identity *preserves* pick identity. And on the GPU each pick item costs only one 80-byte uniform + bind group.\n\nAlso note `pipelines.rs:410-435` (the orphaned, uncompiled file) already contains a `pick` pipeline with a dedicated `pick_color` target, `layout_pick`, and `bgl.pick` \u2014 someone started this port and stopped.\n\n## 2. Design A (recommended): id-buffer picking, mirroring the desktop path\n\nZero wire-format change, zero change to the three model stages' shaders. Four small pieces.\n\n### A1 \u2014 Server: ship the id map + the tree (Python)\nIn `wgpu_data_utils/worker.py:_generate_render_list_files` (`:168-217`), after `RemoteRenderList.create(...)` at `:192`:\n\n```python\n# AKS-<id> (Tien): export the pick id -> entity map so the browser can resolve picks.\ncontext = self.app.context\npick_map = {\n    idx: {\"pick\": ref.to_json(context) if hasattr(ref, \"to_json\") else {\"code\": type(ref).__name__}}\n    for idx, ref in pick_color_map.items()\n}\n(output_dir / \"pick_map.json\").write_text(json.dumps(pick_map))\n```\nPrecedent + the exact shape to follow: `gl_renderer.py:29-36`.\n\nFor the **semantic tree**, expose the walk keys the base class already builds. `RemoteRenderList` can record `key_tuple` alongside each pick allocation (the tuple is in scope at `render_list.py:127-135`; it currently reaches `graphics_body_key_map` at `:132` and is dropped by the remote impl). Emit `{\"idx\": ..., \"path\": [\"layer0\", \"group_a\", \"body_7\"], \"pick\": {...}}` into the same `pick_map.json`. That is plan step 2's tree, for free, from HUI's own hierarchy.\n\nNon-obvious constraint: `pick_color_map` keys are **random per export** (`render_list.py:109-111`), so ids are *not* stable across re-exports. Fine for click-to-data within a session; if cross-session/persisted selection is ever needed, key the map on `pick_ref` content (e.g. `component_id`) instead \u2014 a separate, later change. Say so in the ticket rather than discovering it later.\n\n### A2 \u2014 Rust: a `PickStage` that renders ids offscreen\nNew `src/pick_stage.rs`, modelled on `translucent_stage.rs` (same flat/colour-only vertex layout \u2014 pick items carry no normals and no scalars). Register on all 10 boundary points listed in `01_explorer_wgpu_bim_gap.md` \u00a72 step 7 \u2014 **`lib.rs:6-30` is the one people forget; that omission is exactly why `pipelines.rs` is dead.**\n\n- Filter `RenderStage::PickRenderStage` in `set_render_bundle`, bundle it once at load like the other three.\n- Own offscreen colour target, **`Rgba8Unorm` + `COPY_SRC`**, plus its own depth texture, sized with the surface in `saved_framebuffer.rs:126-149`. Must be a separate attachment from the visible one \u2014 do not reuse the shaded target.\n- Clear to `0,0,0,0`: `decode_padic` of black is `0`, which the desktop path already treats as \"nothing hit\" (`pick_info.py:82`).\n- Render it **only on demand** (on a click), not per frame \u2014 an extra pass per click is free; per frame it would be ~30 % more draw calls.\n- Shader: pass `item_data.color` straight to the fragment output, **no lighting, no alpha blend, no depth bias**, `cull_mode: Back`, depth `Less` with write enabled. Bias (`shaded_stage.rs:332-336`) would shift which element wins a pixel \u2014 do not copy it in.\n\n### A3 \u2014 Rust: readback + decode\n`copy_texture_to_buffer` the 1\u00d71 texel under the cursor into a `MAP_READ | COPY_DST` buffer, `map_async`, decode base-256 exactly as `pick_info.py:7-12`:\n```rust\nlet idx = rgb[0] as u32 + 256 * rgb[1] as u32 + 65536 * rgb[2] as u32;\n```\nMind two traps: `bytes_per_row` must be padded to 256 (`COPY_BYTES_PER_ROW_ALIGNMENT`) even for one texel; and the texture is **not** sRGB \u2014 pick the surface's non-sRGB sibling (`wgpu_renderer.rs:366-371` already prefers non-sRGB) or the round-trip corrupts the low bits.\n\n**Risk to spike first (30 min, decides A vs B):** buffer mapping and `copy_texture_to_buffer` on wgpu's **GL backend under WebGL2**. `downlevel_webgl2_defaults()` (`wgpu_renderer.rs:322`) is restrictive and wgpu emulates mapping there. If readback is unavailable, fall back to a `readPixels`-shaped path or go to Design B. Do not write A2\u2013A4 before this spike passes.\n\n### A4 \u2014 Rust\u2192JS: the round trip that doesn't exist yet\nAdd to `web_app.rs` alongside the existing five callbacks (`:71-75`, setters `:92-120`):\n- `set_on_pick(cb)` \u2014 fires `{element_id, x, y}`; JS resolves it against `pick_map.json`, which **JS fetches and owns** (keep the map out of wasm \u2014 it is host data, and this avoids a second copy in linear memory).\n- `pick_at(canvas_id, x, y)` \u2014 or better, hook the existing left-button path. Left is currently reserved for the triad (`graphics_window.rs:242-264`); route \"triad miss \u2192 scene pick\" so the gizmo keeps priority.\n- `set_selection(canvas_id, element_ids: Vec<u32>)` \u2014 inbound highlight.\n\n### A5 \u2014 Selection highlight, client-side\nDo **not** use the server's `add_selection_and_highlight_items` (`render_list.py:200+`) \u2014 it requires a re-export per click, which is fine on the desktop and absurd over HTTP.\n\nThe audit's \"items aren't addressable\" is only true of the baked bundle: `render_map` **retains** `Vec<RenderItem>` (`render_list.rs:127`, pushed at `:585`). So add one index in `RenderList::new`: `element_id \u2192 (RenderStage, ItemKey, vertices_id, indices_id, index_range)`, where `element_id` is `decode_padic(color)` for pick items. Then draw the selected element's index range immediate-mode with `SELECTION_COLOR` (0.86, 1.0, 0.15, 0.5 \u2014 `render_list.py:89`) in a small overlay stage, using `depth_compare: Always` like `sensor_stage.rs:124-132` so it reads as a highlight. No bundle rebuild, no re-fetch, no `HighlightRenderStage` revival needed.\n\n### A6 \u2014 Query / aggregate / dashboards (plan steps 3\u20134, 16)\nPure host-side TS over `pick_map.json` \u2014 no renderer work. Visual feedback for a query result reuses two things that already exist:\n- **filter \u2192 highlight**: `set_selection` with the matching ids (A4).\n- **colour by property**: the scalar-field path already has a discrete `is_enumerating` branch (`scalar_field_stage.rs:53-70`). Write a per-vertex `<property>.bin` whose values are category indices, set `ColorBarConfig` bins, call the existing `update_scalar_field` (`web_app.rs:137`). **No shader work for categorical BIM colouring.**\n\n## 3. Design B (fallback / later): `element_id` in `ItemData` + MRT\n\nAdd `element_id: u32` to `ItemData` (`wgpu_renderer.rs:229-234`) **and to `ItemKey`** (`render_list.rs:434-437`, or dedup will merge distinct elements again \u2014 this is the literal \"identity destroyed\" fix), add the field to the Avro `RenderItem` (`remote_render_list.py:62-78` + `render_list.rs:45-58`), and write it to a second colour attachment from the existing three stages.\n\n- Pros: no extra pass, no duplicate `RenderItem`s, every drawn element is pickable (not just `should_draw(pick=True)` ones), and the id becomes available for future GPU work (compute-based culling).\n- Cons: schema change on both sides, WGSL edits in three stages, MRT on the GL backend, and it makes the server's `PickRenderStage` items dead weight (they should then be filtered out at export).\n- Choose B only if the A3 readback spike fails, or once the WebGPU migration (\u00a74) lands.\n\n## 4. The BIM plan, re-cut for this renderer\n\n**Verdict on the stack:** keep the *ideas*, drop the *implementation stack*. web-ifc + three.js is a parallel renderer \u2014 adopting it means abandoning `wgpu_renderer`, not extending it. You cannot have both.\n\n| Plan item | Fate | Why |\n|---|---|---|\n| 1 \"render an IFC (web-ifc + three.js)\" | **DROP as written \u2192 replace** with an **IFC \u2192 Avro importer**: IfcOpenShell/web-ifc server-side, emitting `graphics_api.GraphicsArray` + `pick_ref`s so the entire existing `RemoteRenderList` \u2192 chunk \u2192 wasm path is reused unchanged. IFC's own `GlobalId` becomes the `pick_ref`, which incidentally fixes the random-id instability in A1. | three.js is a *renderer*; we have one. web-ifc/IfcOpenShell are *parsers* \u2014 keep those. |\n| 2 semantic tree + click-to-data | **DO NOW.** \u00a72 \u2014 mostly wiring, all upstream pieces exist. | \u2014 |\n| 3\u20134 query / dashboards | **DO NOW**, host-side TS + `set_selection` + the categorical colour path. | Zero renderer work. |\n| 5 instancing | **BLOCKED on WebGPU.** Instancing at scale means per-instance `ItemData` in a **storage buffer indexed by instance** \u2014 WebGL2 downlevel limits have no vertex-stage storage buffers, and the current design is one uniform + one bind group per item (`render_list.rs:506-534`). | Steps 5 and 17 are the same decision, not two. |\n| 6 frustum culling | **DO after \u00a72.** Cheapest unlock in the codebase: `get_bounding_box_in_model` (`render_list.rs:747-776`) already computes a per-`(model_from_local_id, vertices_id)` box and **discards the map** at `:751`. Retain it \u2192 culling *and* pick broad-phase from one change. Then bundles must be rebuilt on camera change (or split per spatial cell) \u2014 that is the real work, not the maths. | \u2014 |\n| 7 occlusion culling | **BLOCKED on WebGPU** \u2014 `occlusion_query_set` is unsupported on the GL backend (all 7 passes pass `None` today). | \u2014 |\n| 8\u20139 LOD + SSE | Compatible, but **server-side first**: a decimated LOD chain per body in `worker.py`, extra `ArrayDescriptor`s + a detail tier on `RenderItem`. meshoptimizer operates on exactly the index/vertex arrays `GraphicsArray` already holds. | Plan's own conclusion: LOD is baked offline. |\n| 10 server-side tessellation | **ALREADY DONE** \u2014 `helper_functions.py:20-80` + `worker.py:168-217`. | \u2014 |\n| 11 streaming + LRU | **Extend the existing chunk manifest into spatial tiles**; do **not** adopt 3D Tiles / Cesium (a whole second format + runtime alongside Avro/`ArrayDescriptor`). Needs incremental `RenderList` + bundle rebuild + eviction \u2014 the largest item on the list. | `finalize_chunks` (`web_app.rs:705-713`) currently demands every chunk before anything renders. |\n| 12 RTC / f64 | **Downgrade, and solve at import.** Ortho projection + per-frame shrink-wrapped near/far (`transformations.rs:25-26`) already blunt the classic jitter, and HUI geometry is component-local with a `model_from_local`. For IFC with survey offsets, subtract a global origin **in the importer** \u2014 that is RTC, at zero renderer cost. Only if that proves insufficient: eye-relative vertices (not f64 \u2014 `Dtype` can't express it, `render_list.rs:27-32`). | \u2014 |\n| 13 decoupled loader | **DO \u2014 highest-value non-semantic item.** Today avro parse + per-8-MiB MD5 + full memcpy + whole-blob `create_buffer_init` run in one `spawn_local` (`web_app.rs:293-318`): the tab freezes and the progress bar reads 100 % while it does (`loadRenderData.util.ts:81-84`). Move decode to a Worker, slice uploads into budgeted `write_buffer` calls. | The research calls this the one rule and the one painful retrofit. |\n| 14 local cache | Cheap win, unchanged from plan: OPFS/IndexedDB in the JS loader, plus caching scalar-field buffers (the TODO at `render_list.rs:663-667`). | \u2014 |\n| 15 benchmark harness | **Pull earlier \u2014 do it before 5/6/7.** No numbers exist today (`canvas_id_to_loading_progress` is written once and never read, `web_app.rs:43,281`). Without it, \"instancing helped\" is unfalsifiable. | \u2014 |\n| 16 NL query | Unchanged, host-side, after 3. | \u2014 |\n| 17 WebGPU | **Not a flag flip, not a rewrite.** `let use_webgl = true;` is a hardcoded local (`wgpu_renderer.rs:297-306`) \u2192 `Backends::GL` + `downlevel_webgl2_defaults()`; the `webgl` feature is unconditional (`Cargo.toml:14`). Right move: **try a WebGPU adapter, fall back to GL**, and gate 5/7 behind it. The GL-shaped buffer split (`render_list.rs:174-182`) stays valid on WebGPU, just unnecessary. | wgpu is the abstraction \u2014 this is why the crate is the right base. |\n| stack: xeokit | Reference reading only, not a dependency. | \u2014 |\n| stack: Draco | Defer. Chunked + gzip transport is likely enough; a wasm decoder in the loader is a later optimisation. meshoptimizer (for 8\u20139) stays. | \u2014 |\n\n**Order:** benchmark harness (15) \u2192 semantic layer (\u00a72: 2, 3, 4) \u2192 decoupled loader (13) \u2192 frustum culling + retained bboxes (6) \u2192 WebGPU adapter fallback (17) \u2192 instancing (5) \u2192 LOD (8, 9) \u2192 streaming/eviction (11).\n\n## 5. Open questions for the user (per orchestrator's ~20 % milestone gate)\n\n1. **Design A or B?** A is recommended and gated on the A3 readback spike. Say the word and I run the spike first.\n2. **Do the ids need to survive a re-export?** If yes, A1 keys the map on `pick_ref` content instead of the random idx \u2014 decide now, it is cheap now and invasive later.\n3. **Is the IFC path real, or is this a HUI-model viewer?** \u00a74 row 1 (an IFC \u2192 Avro importer) is a substantial piece of work; everything else in \u00a72 is useful either way.\n4. Ticket number for the `AKS-<id> (Tien): \u2026` comment convention.\n"}, {"id": "03_design_large_model", "title": "Design: large models", "md": "# 03 \u2014 Design: rendering large models in `wgpu_renderer`\n\nRevises the perf half of [01_explorer_wgpu_bim_gap.md](01_explorer_wgpu_bim_gap.md) \u00a72 and [02_design_semantic_layer.md](02_design_semantic_layer.md) \u00a74, after two claims were checked against wgpu 27 source. **Both corrections change the order of work.**\n\n---\n\n## 1. Correction 1: render bundles do not reduce draw-call cost on WebGL2\n\n`wgpu-core-27.0.3/src/command/bundle.rs:983-999` \u2014 `RenderBundle::execute` iterates `self.base.commands` and **re-issues each recorded command into the HAL pass**. `render.rs:3004` `execute_bundle` is just that loop. There is no backend object that collapses a bundle into one driver submission on the GL backend.\n\nSo the three baked bundles (`shaded`, `scalar_field`, `translucent`) buy **wgpu-side validation and bookkeeping savings, not GL call savings**. Every `draw_indexed` still reaches the driver individually, every frame.\n\nConsequence, and this is the important one: **the \"bundles are immutable, so per-frame culling is structurally impossible\" blocker from the audit is much weaker than it looked.** Dropping bundles for the model stages and encoding draws per frame *with frustum culling* costs the validation overhead the bundle was saving, and saves every culled draw. For any model where a meaningful fraction is off-screen, that trade is strongly positive. Culling moves from \"hard, needs a bundle-rebuild strategy\" to \"straightforward\".\n\n## 2. Correction 2: instancing is NOT gated on WebGPU\n\n[02_design_semantic_layer.md](02_design_semantic_layer.md) \u00a74 claimed steps 5 and 17 were one decision. That is wrong, and this repo disproves it: `overlay_pass.rs:125` already uses `wgpu::VertexStepMode::Instance`, drawn at `:296` as `draw(0..6, 0..vertex_count)`, and it ships to browsers on WebGL2 today. WebGL2 has instanced arrays in core.\n\nWhat is actually WebGPU-gated:\n- **storage buffers in the vertex stage** \u2014 i.e. the \"one big `ItemData` array indexed by `@builtin(instance_index)`\" design. Not available under `downlevel_webgl2_defaults()`.\n- **occlusion queries** \u2014 `occlusion_query_set` is unsupported on the GL backend.\n\nInstancing on WebGL2 is therefore available *via per-instance vertex attributes*: put `model_from_local` (4 \u00d7 `vec4`) + `color` (1 \u00d7 `vec4`) in an instance-step vertex buffer instead of a per-item uniform. 5 attribute slots of the 16 WebGL2 guarantees, alongside position/normal/scalar. This replaces the one-uniform-buffer-and-bind-group-per-`ItemKey` design (`render_list.rs:486-537`) for the common case.\n\n## 3. The real ceiling for large models is the load path, not the renderer\n\nThis is the part that bites first, and it is a hard wall rather than a slowdown.\n\nToday, per `01_...gap.md` \u00a72 step 13, one `spawn_local` (`web_app.rs:293-318`) does: avro parse \u2192 per-8-MiB `md5::compute` \u2192 `finalize_chunks` full-blob memcpy (`:715-720`) \u2192 `create_buffer_init` of the entire per-type blob (`render_list.rs:336`). Peak residency is **~3\u00d7 the geometry size**: `unmerged_chunks` + the concatenated blob + the wgpu staging copy.\n\nAll of that lives in **wasm32 linear memory, which is capped at 4 GB** (and practically lower). So a 700 MB geometry export needs ~2.1 GB of wasm address space to *load*, before considering VRAM. That, not the WebGPU per-buffer limit, is the \"2 GB problem\" for this renderer \u2014 and the research doc's reassurance (\"geometry lives in ArrayBuffers, not the JS heap\") does not apply, because here it lives in wasm linear memory and is copied twice.\n\n**The fix, and it is enabled by data the format already carries:** `array_descriptors` give the exact dtype and shape of every array up front (`render_list.rs:37-43`, `get_n_bytes` at `:95`). So the destination GPU buffer sizes and every array's offset are known *before any chunk arrives*. Therefore:\n\n1. Parse the avro, compute the buffer layout, `device.create_buffer` each destination buffer empty (`COPY_DST | VERTEX/INDEX`).\n2. As each 8 MiB chunk lands, `queue.write_buffer` it straight into the right offset \u2014 splitting the write where a chunk straddles a buffer boundary (chunk boundaries are at 8 MiB, buffer boundaries at `BufferType` transitions; they do not align).\n3. Never build `unmerged_chunks`, never concatenate, never `create_buffer_init`.\n\nPeak wasm memory becomes **one chunk (8 MiB)** instead of 3\u00d7 the model. The freeze disappears because each chunk is a small unit of work. And it makes progressive rendering possible later (draw what has arrived) \u2014 `finalize_chunks`' all-or-nothing gate (`web_app.rs:705-713`) goes away.\n\nTwo cheap companions: drop or debug-gate the per-chunk MD5 (8 MiB of hashing per chunk on the main thread, over a channel HTTPS already integrity-checks), and fix the progress bar, which reaches 100 % before finalize+upload (`loadRenderData.util.ts:81-84`, `WgpuCanvas.tsx:268`) so the UI claims \"done\" precisely while the tab is locked.\n\n## 4. Revised order for large models\n\n| # | Work | Why here | Effort |\n|---|---|---|---|\n| 1 | **Benchmark harness** \u2014 draw calls, `RenderItem` count, frame-time 1 % lows, parse/upload ms, buffer bytes | Nothing below is falsifiable without it, and there are zero numbers today (`canvas_id_to_loading_progress` is written once, never read, `web_app.rs:43,281`) | S |\n| 2 | **Streaming upload** (\u00a73): pre-allocate from `array_descriptors` + `write_buffer` per chunk | Removes the 3\u00d7-geometry wasm ceiling *and* the load freeze. Biggest single win, and it is a memory-limit fix, not just a speed fix | M\u2013L |\n| 3 | **Free draw-call wins, no architecture change**: merge adjacent index ranges within a `(stage, ItemKey, vertices_id, indices_id)` group (their ranges are already contiguous in one buffer); hoist `set_vertex_buffer(1, \u2026)` out of the per-item loop (`shaded_stage.rs:194-197`, `scalar_field_stage.rs:352-355`); swap the nested `HashMap`s (`render_list.rs:119-131`) for `BTreeMap` so draw order is deterministic \u2014 which also fixes the run-to-run-varying transparency order | Pure wins. The merge alone can collapse many draws to one | S\u2013M |\n| 4 | **Frustum culling, immediate-mode** \u2014 retain the per-element bboxes that `get_bounding_box_in_model` already computes and discards (`render_list.rs:751-767`), drop the model-stage bundles, encode with culling per frame | Unblocked by Correction 1; the bboxes are already being computed | M |\n| 5 | **Instancing via instance-step attributes** (\u00a72) for repeated bodies | Unblocked by Correction 2. Follows 3/4 because it changes the `ItemKey`/bind-group design | M\u2013L |\n| 6 | **Per-frame CPU cleanup**: the O(n\u00b2) `Vec::remove` label-merge fixpoint (`graphics_item.rs:690-711`), ~9 `Vec` + 3 `String` allocs (`wgpu_renderer.rs:880-901`), the per-frame `device.create_buffer` for label rects (`overlay_pass.rs:238-243`), and the ~2.7 KB `Globals` rebuilt and re-uploaded from unchanged inputs every frame (`graphics_window.rs:124-126`) | Label merge is O(n\u00b2) in label count \u2014 with many labels this can dominate a frame | S |\n| 7 | **Server-side LOD chain** in `worker.py` + a detail tier on `RenderItem`, then screen-space-error selection | Correct order per the research: proxies are baked offline. Needs 1 to prove it pays | L |\n| 8 | **Spatial tiling + eviction**, extending the existing chunk manifest (not 3D Tiles) | Largest item; only worth it once 2/4/7 are in | L |\n| 9 | **WebGPU adapter with GL fallback** (`use_webgl = true`, `wgpu_renderer.rs:297`) | Now buys: occlusion queries, storage-buffer instancing, lower validation cost \u2014 no longer a prerequisite for 5 | M |\n\nDeferred, unchanged: occlusion culling (needs 9), Draco (chunked+gzip likely enough), 3D Tiles/Cesium and three.js (\u00a74 of doc 02 \u2014 would mean replacing this renderer).\n\n## 5. Interaction with the semantic layer already built\n\nThe pick pass added in `src/pick_stage.rs` renders one extra `draw_indexed` per pickable face, but **only on a click**, never per frame \u2014 so it does not enter the frame budget. It will need updating alongside items 4 and 5 (it walks the same `render_map`, so culling/instancing changes apply to it identically), and its `pick_at` must become async before item 9, because `poll(Wait)` is a no-op on a real WebGPU device. Both are noted in the module's doc comments.\n"}, {"id": "04_jira_journey_and_tickets", "title": "Jira journey & tickets", "md": "# 04 \u2014 AKS-18576 journey, AKS-18641 review, and the tickets to create\n\nRead 2026-07-29 from Jira: epic **AKS-18576 \"3D widget for Papps\"** (all 34 children) and **AKS-18641 \"Implement object picking (single pixel only)\"** (all 4 comments). Revises [02_design_semantic_layer.md](02_design_semantic_layer.md) \u00a71 \u2014 see \u00a73, which is a correction to my own claim.\n\n---\n\n## 1. The journey (AKS-18576, 34 children)\n\nEpic itself is still `TODO`, label `Papp`, reporter Trong Luong, opened 2025-10-31.\n\n**Done (27):** foundation by Brian Sabbey (AKS-17772) \u2192 export script (18636) \u2192 fit-to-screen (18637) \u2192 color bar (18638, 19365, 20017) \u2192 shaded stage (18639) \u2192 triad (18640) \u2192 sensors (18932, 18933, 19224, 19225) \u2192 split geometry/field files (19130) \u2192 chunking (19283) \u2192 parallel chunk download (20016) \u2192 align view (19223) \u2192 TS user controls (19226) \u2192 deploy to Papp dashboards (19229, 19250, 20061) \u2192 CI build (19260) \u2192 solution-field UI (19457) \u2192 config refinement (20190) \u2192 error fixes (20110).\n\n**In review (2):** AKS-19366 static clip plane, AKS-19367 unit tests for the 3D widget.\n\n**On-hold (3):** AKS-18579 explore use cases, **AKS-18641 picking**, AKS-19262 minimize `array_data.bin` size.\n\n**Open TODO (3):** AKS-20745 min/max locations, AKS-20746 visibility option box, AKS-20774 consolidate configs.\n\n**What the epic has never contained:** a single ticket for draw-call/perf work (no instancing, culling, LOD, streaming-upload, benchmarking), and nothing for querying the model as data (no semantic tree, filter, aggregate, schedule). The nearest neighbours are AKS-19262 (payload *size*, on hold) and AKS-20746 (show/hide layers). So the BIM work is genuinely new scope, not a re-tread \u2014 with the one exception of picking, which is AKS-18641.\n\n## 2. AKS-18641 review\n\nStatus On-Hold since 2026-02-06 (auto-transitioned after 4 weeks idle), assigned to Tien, priority Low. Description already carves out rectangular pick as a later separate ticket.\n\n**The three decisions in the comments, and where they land now:**\n\n1. **Thuc:** exclude highlighting and selection from this ticket, do them later. \u2192 The `pick_stage.rs` on branch `wgpu-pick-semantic` matches this exactly: pick only, no highlight. Highlight/selection therefore need their own ticket (\u00a74 item S4).\n\n2. **Brian Sabbey (who wrote the HUI picking code):** *\"I'm not very worried about stalling the graphics pipeline. Much of the advice about graphics programming is intended for games trying to reach 120 Hz... We don't need so many frames per second.\"* \u2192 This settles the ticket's central worry. The long `map_async`/async-readback investigation in the first comment was solving a problem the author says we don't have. The implementation on branch uses a **synchronous** `poll(wait_indefinitely)` readback, which is both simpler and sanctioned. It stays valid as long as the renderer is on the GL backend, and only needs to become async if/when WebGPU is adopted (noted in the module doc comment).\n\n3. **Brian:** suggests **compute-shader ray casting** instead of pixel picking, since wgpu has compute shaders and HUI's era did not. \u2192 **This path is currently blocked, and the ticket does not record why:** the renderer runs on WebGL2 (`use_webgl = true` hardcoded at `wgpu_renderer.rs:297-306`, `downlevel_webgl2_defaults()` at `:322`, `webgl` feature unconditional in `Cargo.toml:14`). **WebGL2 has no compute shaders.** So compute-shader picking requires the WebGPU migration first. Under today's configuration, pixel-based picking is the only option \u2014 which is what got built. Worth adding as a comment so the option isn't re-litigated.\n\n4. **Brian:** *\"`pipelines.rs` is not used... I asked AI to translate some of our pipeline code to Rust... I believe you should be able to delete that file and still compile.\"* \u2192 Confirms the audit finding independently, and explains the first comment's *\"I'm still confusing on using this pipeline.rs file\"*. It is dead. Note it still contains the only written-down design for the pick/highlight/selection pipelines, so mine it before deleting.\n\n**One factual fix for the ticket's own comparison table:** it lists our Primary Backend as \"WebGPU (via wgpu-rs)\". It is **WebGL2** via wgpu's GL backend. Several conclusions in that table (and the whole compute-shader option) depend on the difference.\n\n## 3. Correction to doc 02: pick geometry is NOT free, and solutions may have none\n\n[02_design_semantic_layer.md](02_design_semantic_layer.md) \u00a71 claimed pick items add \"~zero geometry bytes\" because `remember_array` dedups arrays with their display twin. **That holds only when one `GraphicsBody` carries both `draw_pick` and `draw_regular`.** It frequently does not:\n\n- `should_draw` gates pick items on `graphics_body.draw_pick` (`gl_graphics/render_list.py:216-223`).\n- The common model path builds a **separate** pick tree with its own geometry: `ga.GraphicsTree.create(pick_graphics_items, draw_pick=True, draw_regular=False)` (`akselos/ui/graphics_trees/graphics_group_node.py:251`), with the comment at `:249` noting it is skipped during pan/rotate/zoom for speed. Separate `GraphicsArray`s \u2192 separate `array_id`s \u2192 **real extra bytes** in `array_data.bin`. (Often simplified geometry, so cheaper than the display body, but not free.) This interacts directly with AKS-19262 (payload size).\n- **Solution graphics are built with `draw_pick=False`** \u2014 `solution_graphics/nodeset_field_graphics.py:53`, `solution_mesh_graphics.py:127`, `solution_undeformed_model_graphics.py:514`, and `component_type_layer.py:125,138`. And `worker.py:182` exports only `graphics_layer_idxs = [0]`.\n\n**Therefore: today's exports may contain no `PickRenderStage` items at all**, in which case the pick pass renders nothing and every click reports empty space. This is exactly what Brian meant by *\"My original Rust graphics code only sent the first graphics layer... One possibility would be to send the pick layer as well.\"*\n\nThis makes \"make the export actually carry pick items\" a **blocking prerequisite**, not a detail \u2014 and it must be verified empirically by exporting a real `.aks` and an `.asl` and counting `PickRenderStage` render_items. I could not run that here (needs HUI under Xvfb plus a model). It is ticket **S2** below and should be done before S3.\n\n## 4. Tickets to create\n\nReuse, don't duplicate:\n\n| Existing | Action |\n|---|---|\n| **AKS-18641** | Reopen from On-Hold. The branch `wgpu-pick-semantic` implements it (single-pixel pick, `src/pick_stage.rs`, `set_on_pick`). Add a comment recording: compute-shader picking needs WebGPU (no compute on WebGL2); sync readback is per Brian's guidance; `pipelines.rs` confirmed dead. |\n| **AKS-19262** (on hold) | Now has a concrete driver: separate pick geometry adds bytes (\u00a73). Link to S2. |\n| **AKS-20746** visibility box | Natural host UI for semantic filtering; link to Q2. |\n| **AKS-19367** unit tests | The two `decode_padic` tests on the branch belong here or in 18641. |\n\nNew tickets. Suggested parent: keep the semantic ones under **AKS-18576**, and open a **second epic for performance/large models** \u2014 that track is big enough to deserve its own epic and has zero coverage today.\n\n### Semantic track (this is what makes it BIM) \u2014 under AKS-18576\n\n| ID | Ticket | Depends on | Size |\n|---|---|---|---|\n| **S1** | *Export pick id \u2192 entity map (`pick_map.json`) with graphics-tree key path.* Server side; `_write_pick_map` in `worker.py`, key-path capture in `RemoteRenderList`. Includes content-derived `stable_id` so selections survive a re-export (the colour idx is random per export). **Implemented on branch.** | \u2014 | S |\n| **S2** | *Make exports carry pick items.* Export the pick-enabled graphics trees/layers (\u00a73, Brian's comment), verify `PickRenderStage` item counts for a real `.aks` and `.asl`, and decide whether solution views get pick geometry at all. **Blocks S3.** | S1 | M |\n| **S3** | *Click-to-data end to end.* Renderer part done (pick pass + `set_on_pick`); remaining is the React side: fetch `pick_map.json`, resolve the id, show a properties panel. | S2 | M |\n| **S4** | *Highlight + selection.* The feature Thuc deferred out of AKS-18641. Client-side overlay driven by a retained `element_id \u2192 RenderItem` index, plus an inbound `set_selection(ids)`; mine `pipelines.rs:386-408` for the blend pipelines before deleting it. | S3 | M |\n| **S5** | *Semantic tree UI.* Project\u2192Group\u2192Body tree from `key_path`, two-way linked with selection. | S3 | M |\n| **S6** | *Query / filter / aggregate layer.* Host-side over `pick_map.json`: filter by property, count/sum/group-by. This is the actual BIM litmus test \u2014 ask a question, get a data answer. | S5 | M |\n| **S7** | *Dashboards & schedules from model data.* Charts/quantity tables driven by S6. | S6 | M |\n| **S8** | *Colour by property (categorical).* Reuses the existing `is_enumerating` discrete branch in the scalar-field shader \u2014 host writes a category-index array and calls the existing `update_scalar_field`. **No shader work.** | S6 | S |\n| **S9** | *Rectangular / multi-pick.* Already carved out in AKS-18641's description and needed for the overlapping-sensor-label work. | S3 | M |\n\n### Performance / large-model track \u2014 new epic\n\n| ID | Ticket | Depends on | Size |\n|---|---|---|---|\n| **P1** | *Benchmark harness* \u2014 draw calls, RenderItem count, frame-time 1 % lows, parse/upload ms, buffer bytes. Zero numbers exist today. **Do first; everything else is unfalsifiable without it.** | \u2014 | S |\n| **P2** | *Streaming GPU upload.* Pre-allocate buffers from `array_descriptors`, `write_buffer` each chunk on arrival. Removes the **~3\u00d7 geometry peak in wasm32 linear memory (4 GB cap)** and the load freeze. Biggest single win; it is a memory-ceiling fix, not just speed. | P1 | L |\n| **P3** | *Free draw-call wins.* Merge adjacent index ranges in a group; hoist `set_vertex_buffer` out of the per-item loop; `BTreeMap` for deterministic order. | P1 | S\u2013M |\n| **P4** | *Frustum culling* with the per-element bboxes `get_bounding_box_in_model` already computes and discards. Bundles can be dropped \u2014 they don't save driver calls (wgpu replays them command-by-command). | P3 | M |\n| **P5** | *Instancing via instance-step vertex attributes.* Works on WebGL2 \u2014 `overlay_pass.rs` already does it. | P4 | M\u2013L |\n| **P6** | *Per-frame CPU cleanup.* O(n\u00b2) label-merge fixpoint, ~9 `Vec` + 3 `String` allocs/frame, per-frame label-rect `create_buffer`, 2.7 KB `Globals` rebuilt from unchanged inputs. | P1 | S |\n| **P7** | *Server-side LOD chain + screen-space-error selection.* | P1, P4 | L |\n| **P8** | *Spatial tiling + LRU eviction*, extending the existing chunk manifest (not 3D Tiles). | P2, P7 | L |\n| **P9** | *WebGPU adapter with GL fallback.* Unlocks occlusion queries, storage-buffer instancing, and Brian's compute-shader picking. Requires `pick_at` to go async. | P1 | M |\n\n### Bugs found by the audit \u2014 file as defects, not features\n\n| ID | Defect |\n|---|---|\n| **B1** | Depth ordering is wrong: translucent draws *before* opaque, then the shaded pass **clears depth** mid-frame (`shaded_stage.rs:130-136`), so shaded geometry never depth-tests against scalar-field/translucent output. Compounded by `HashMap`-order draws, so transparency varies run to run. |\n| **B2** | Loading progress reaches 100 % *before* `finalize_chunks` + upload, so the UI reads \"done\" precisely while the main thread is frozen. |\n| **B3** | `has_rendered` is initialised `true` and never reassigned \u2192 the pre-first-frame input gate at `web_app.rs:557-568` never fires. |\n| **B4** | Panic trap: `_get_buffer_slice` unwraps, so a `ShadedRenderStage` item with `normals_id == -1` panics even though `validate_arrays` permits it. |\n| **B5** | Stale artifacts: committed `pkg/` exports four functions that no longer exist and lacks `RenderDataLoader`; `tools/wgpu_renderer/README.md` has the wrong out-dir and path; `TARGET_VERSION_FILE` is declared but never written, so the deployed wasm's source revision is unknowable. |\n| **B6** | Delete `pipelines.rs` (per Brian) \u2014 after mining its pick/highlight/selection pipeline designs for S4. |\n\n**Minimum set to claim \"it is BIM\":** S1 \u2192 S2 \u2192 S3 \u2192 S5 \u2192 S6. S4/S8 make it feel like a product; S7 is the BI layer. P1+P2 are what make it survive a large model at all.\n"}, {"id": "05_benchmark_and_limits", "title": "Benchmark & limits", "md": "# 05 \u2014 Benchmark design and the real limits (target: 100 GB model)\n\nScope change from the manager: **stop at 3D visualisation / rendering limits**, not full BIM features. Constraint from Tien: **do not depend on HUI exports** \u2014 inflate the sample data already shipped in `dashboard/papps/frontends/public/` instead.\n\nReferences: [How to benchmark cloud-based BIM platforms](https://medium.com/transformosa-blog/how-to-benchmark-cloud-based-bim-platforms-168ce23f9c1b) (Transformosa) and [GPUScore](https://www.gpuscore.com/benchmarks/) (Basemark).\n\n---\n\n## 1. The generator: `tools/wgpu_renderer/wgpu_data_utils/synth_bench.py`\n\nWritten and verified this session. Reads a real export as a seed and inflates it. Imports only `fastavro` \u2014 no HUI, no `akselos`, no `graphics_api`. **Run it by file path, not `-m`**, because `wgpu_data_utils/__init__.py` pulls in `helper_functions` \u2192 `import akselos`:\n\n```bash\npython tools/wgpu_renderer/wgpu_data_utils/synth_bench.py --seed-dir dashboard/papps/frontends/public --out-dir /tmp/bench/2gb --ballast 1625\n```\n\nThe schema is read back out of the seed file, so it cannot drift from `gl_graphics/remote_render_list.py`.\n\n### Three orthogonal knobs \u2014 the design point\n\nThe audit's central finding is that **element/draw-call count, not triangle count or bytes, is the usual bottleneck**. A single \"make it bigger\" knob conflates the two and tells you nothing. So:\n\n| Knob | What grows | What stays fixed | Isolates |\n|---|---|---|---|\n| `--ballast N` | bytes, GPU buffers, chunk count, transfer | draw calls (**unchanged**) | the load path: wasm memory ceiling, upload time, VRAM |\n| `--instances N` | draw calls, per-item uniforms + bind groups | geometry bytes (+64 B/instance) | draw-call cost *with* bind-group churn |\n| `--split-items K` | draw calls only | bytes, arrays, **and the rendered image is pixel-identical** | *pure* draw-call overhead, everything else held constant |\n\n`--ballast` works because `ArrayBundle::new` (`render_list.rs:154-318`) uploads **every** descriptor, while only render items reach a `draw_indexed`. Ballast arrays are referenced by no item: they cost transfer, wasm memory and a GPU buffer, and are never drawn. `--split-items` works because `indices_start_row/end_row` are row indices into the index array (`render_list.rs:101-105`), so one item's range can be cut into K contiguous items covering exactly the same triangles.\n\nScalar arrays are never duplicated: a duplicated vertex array has the same vertex count, so items keep the seed's scalar id and the field `.bin` files stay untouched (and `validate_arrays`' `len == n_vertices` check still passes).\n\n### Verified behaviour\n\n| Run | Items \u2192 draws | Arrays | `array_data` | Chunks |\n|---|---|---|---|---|\n| seed | 8 | 28 | 1.3 MiB | \u2014 |\n| `--split-items 4` | **32** | 28 | **1.3 MiB (byte-identical)** | \u2014 |\n| `--instances 50` | **400** | 420 | 1.28 MiB (+25 KB) | \u2014 |\n| `--ballast 200` | **8 (unchanged)** | 4804 | **252 MiB** | 32 |\n| `--ballast 20 --instances 8 --split-items 2` | 128 | 540 | 25.2 MiB | 4 |\n\nRound-trip validated on the output: descriptor bytes == chunk manifest bytes, every chunk's size + MD5 matches, no dangling array ids, ids unique, and the descriptor list order matches the byte order.\n\nThat last one caught a real bug during development: **the record's `array_descriptors` order is load-bearing.** `ArrayBundle::new` walks the list in order and accumulates byte offsets as it goes, so the list must be ordered exactly as the bytes were written \u2014 non-scalar sorted by `(buffer_type, array_id)`, then scalar sorted the same way, matching `_write_array_data`. An unsorted list silently yields garbage geometry rather than an error.\n\n### Two incidental findings about the shipped sample\n\n- **`public/render_group.avro` predates chunking.** Its `RenderGroup` record has only `render_items` + `array_descriptors`, with no `array_chunks` field (added by AKS-19283). The generator now upgrades the schema when asked for chunked output. The deployed demo asset is therefore an older format than the loader's chunk path expects.\n- **The sample contains zero `PickRenderStage` items** \u2014 4 `ScalarFieldRenderStage` + 4 `TranslucentRenderStage`, and no `ShadedRenderStage` either. Independent confirmation of doc 04 \u00a73: exports as they exist today carry no pick geometry, so click-to-data has nothing to hit.\n\n## 2. Metrics to capture\n\nFrom the Transformosa article (its checklist, mapped to what we can instrument):\n\n- \u2713 **Upload / conversion time** \u2192 server-side export time (`worker.py`); for synthetic runs, generation time \u2014 not interesting, record for completeness.\n- \u2713 **Model load time in browser** \u2192 must be split into phases, because today they are one blocking task (`web_app.rs:293-318`): fetch \u2192 avro parse \u2192 MD5 \u2192 merge \u2192 `create_buffer_init` \u2192 first frame. Report each separately; the article's single \"load time\" would hide exactly the problem we have.\n- \u2713 **FPS during navigation** (orbit / zoom / pan / sectioning) \u2192 sectioning maps to the clip-plane feature (AKS-19366).\n- \u2713 **Downloaded size, compressed and uncompressed** \u2192 `array_data.bin` vs gzip-on-the-wire; relates to AKS-19262.\n- \u2713 **Network bandwidth** \u2192 record throughput and chunk concurrency (6-way today, `loadRenderData.util.ts:100`).\n- \u2713 **Documented hardware / browser / network** \u2192 the article pins CPU, GPU, RAM, OS, Chrome version, up/down Mbps. Do the same or numbers are not comparable across machines.\n\nAdd these, which the article omits and which matter more for this renderer:\n\n- **Draw calls per frame** \u2014 the actual bottleneck. Equal to render-item count today (every stage draws with instance range `0..1`), so `expected_draw_calls` in the manifest is the ground truth to check instrumentation against.\n- **Frame-time percentiles (1 % and 0.1 % lows)**, not just average FPS. GPUScore's *public* metrics are score + average + min/max FPS only; average FPS hides the stalls that make a viewer feel broken.\n- **Peak wasm linear memory** \u2014 `WebAssembly.Memory.buffer.byteLength` sampled across load. This is the ceiling (\u00a74), so it is the single most important number.\n- **GPU buffer bytes allocated** \u2014 sum over `ArrayBundle`'s buffers.\n- **Time to first frame** vs time to complete load \u2014 currently the same thing; the gap is the prize for streaming.\n- **Input latency during load** \u2014 the tab is frozen today; measure it explicitly rather than describing it.\n\n### Methodology, borrowed from GPUScore\n\nGPUScore runs **frame-based rather than time-based** (\"maximal comparability, repeatability and measurement quality\", and it sidesteps frame-rate limiters). Do the same: drive a **fixed, scripted camera path over a fixed frame count** and report the frame-time distribution \u2014 not \"orbit around for 10 seconds\", which is unrepeatable and confounds the result with how fast the machine ran. A deterministic path also makes the culling/LOD work (P4/P7) measurable, since the same frames must be reproduced before and after.\n\nNote the renderer paints **on demand**: `ControlFlow` is never set, so winit's default `Wait` applies and the web build only draws when something calls `request_redraw` (`about_to_wait` is empty on web, `web_app.rs:593`). A benchmark that just idles will record no frames at all \u2014 the harness must drive continuous `request_redraw` itself, or measure only during scripted input.\n\n## 3. Instrumentation points\n\n| Metric | Where |\n|---|---|\n| draw calls, items per stage | count in `set_render_bundle` of each stage; expose via a new wasm getter |\n| GPU buffer bytes | sum in `ArrayBundle::new` (`render_list.rs:320-346`) |\n| load phase timings | around each step of the `spawn_local` in `web_app.rs:293-318`, plus JS-side fetch timings in `loadRenderData.util.ts` |\n| frame time | in `GraphicsWindow::render` (`graphics_window.rs:71`); accumulate a ring buffer, compute percentiles in JS |\n| peak wasm memory | JS side, sampled during load |\n| progress truthfulness | compare the existing progress callback against actual completion \u2014 B2 in doc 04 |\n\n`canvas_id_to_loading_progress` (`web_app.rs:43`) is written once with `100.0` and never read; it can become the real progress channel.\n\n## 4. The 100 GB question, with numbers\n\nThere are **three independent walls**, and all of them are roughly two orders of magnitude away. This is why the answer is architectural, not a tuning exercise.\n\n**Wall 1 \u2014 network.** 100 GB at 100 Mbps \u2248 2.2 hours of transfer, and the loader today requires **every** chunk before anything renders (`finalize_chunks` hard-fails otherwise, `web_app.rs:705-713`). Full download is off the table on transfer time alone, independent of memory.\n\n**Wall 2 \u2014 residency.** Peak load residency is **~3\u00d7 the geometry in wasm32 linear memory**, which is capped at 4 GB and realistically lower: `unmerged_chunks` + the concatenated blob + the `create_buffer_init` staging copy. So today's practical ceiling is roughly **0.7\u20131.0 GB of geometry** \u2014 about 1 % of 100 GB. Fixing the load path (P2: pre-allocate from `array_descriptors`, `write_buffer` per chunk) drops peak wasm memory to one chunk and moves the ceiling to **VRAM**, i.e. ~8\u201324 GB on real hardware \u2014 still 4\u201312\u00d7 short of 100 GB.\n\n**Wall 3 \u2014 draw calls.** A 100 GB model implies ~10\u2075\u201310\u2076 elements. At one `draw_indexed` per element with no instancing and no culling, that is hopeless on WebGL2 regardless of memory.\n\n**Conclusion:** a 100 GB model cannot be \"loaded\" in any form of the current architecture. It requires the resident set to be **decoupled from model size** \u2014 server-side spatial tiling + an LOD chain + streaming with eviction (P7, P8), so the browser only ever holds the visible slice. That is the same conclusion as the research doc's rule (\"smoothness comes from loading LESS\"), but now with the specific numbers for this codebase.\n\n**So the benchmark's job is not \"can it do 100 GB\" (it cannot, by ~100\u00d7). It is to measure each wall on the target hardware so the tiling budget can be derived from data:**\n\n1. **Byte sweep** (`--ballast`, geometric: 1\u00d7 10\u00d7 50\u00d7 100\u00d7 400\u00d7 800\u00d7 1625\u00d7 \u2248 1.3 MiB \u2192 2 GB) \u2014 find the exact size where load fails, and *how* it fails (wasm OOM / `RangeError` / device loss / tab crash). Record peak wasm memory and load-phase times at each step. **This directly yields the per-tile size budget.**\n2. **Draw-call sweep** (`--split-items`, then `--instances`, geometric to 10\u2075) \u2014 find the draws/frame at which the 1 % low crosses the interactivity threshold (~33 ms). **This yields the maximum elements visible per frame**, which sets the LOD/merging target. Running both knobs separately also quantifies how much of the cost is bind-group churn versus the draw itself.\n3. **Chunk-size sweep** (`--chunk-size`) at fixed total bytes \u2014 find the transfer/parallelism sweet spot for the 6-way fetch.\n4. Then, and only then, size the streaming design: required upload bytes/s, tile budget, eviction rate.\n\nExpected outcomes worth writing down in advance so the runs can falsify them: byte scaling dies in **wasm memory well before VRAM**; draw-call scaling degrades roughly linearly with a knee where per-item bind-group rebinding dominates; and `--split-items` at constant bytes shows most of the per-item cost is *not* the geometry.\n\n## 5. What this changes about the earlier plan\n\nThe semantic/BIM tickets in doc 04 (S1\u2013S9) are not what the manager is asking for. Under the new scope, the priority list from doc 03 is exactly right, with the benchmark first \u2014 **P1 (harness) \u2192 P2 (streaming upload) \u2192 P3/P4 (draw calls, culling) \u2192 P5 (instancing) \u2192 P7/P8 (LOD, tiling)**. The pick work already on the `wgpu-pick-semantic` branch is complete and self-contained; it costs nothing per frame (it only renders on a click), so it can sit until the semantic scope returns.\n"}, {"id": "06_instancing_and_merging", "title": "Instancing & merging (code)", "md": "# 06 \u2014 Plan step 5 \"Instancing + merging\": what it means and the code for it\n\nUnpacks the `PARTIAL` verdict in [01_explorer_wgpu_bim_gap.md](01_explorer_wgpu_bim_gap.md) \u00a72 row 5. **Nothing here is applied** \u2014 this is the proposed code, for review.\n\nTwo different techniques are bundled under one plan item. The crate did the cheap one and skipped the valuable one.\n\n---\n\n## 1. Two meanings of \"merging\"\n\n**Merging, plan sense = fewer draw calls.** Concatenate geometry so one `draw_indexed` covers what used to be many.\n\n**Merging, what the crate did = fewer GPU *buffer objects*.** `ArrayBundle::new` walks descriptors and only starts a new buffer when `buffer_type` changes (`render_list.rs:204-222`), so ~28 arrays become ~3 buffers: Vertex, Index, Scalar. That was driven by a WebGL constraint, not performance \u2014 *\"mixing vertex and index data is not allowed with the WebGL backend\"* (`render_list.rs:175`). The author says so on the next line: *\"Not sure if reducing the number of buffers helps performance much, but it's not hard to do.\"*\n\nHence `PARTIAL`: the **data** is contiguous, but the **draws** were never collapsed. Contiguity is the precondition for the win; the win was left on the table.\n\n## 2. What the draw loop costs today\n\n`set_render_bundle` walks a 4-deep nest (`shaded_stage.rs:166-206`):\n\n| Level | Key | State change emitted |\n| --- | --- | --- |\n| 1 | `RenderStage` | filter only |\n| 2 | `n_vertices_per_elem` | `set_pipeline` (2 = lines, 3 = triangles) |\n| 3 | `ItemKey` = (transform_id, colour) | `set_bind_group(2, \u2026)` |\n| 4 | `vertices_id` | `set_vertex_buffer(0, \u2026)` |\n| 5 | `indices_id` | `set_index_buffer` |\n| 6 | **each `RenderItem`** | **`set_vertex_buffer(1, normals)` + `draw_indexed(range, 0, 0..1)`** |\n\nThe nesting exists to hoist state changes out of inner loops \u2014 the comment at `render_list.rs:115-118` says it mirrors HUI's Python loops. It works, except at the last level. Three gaps:\n\n1. **Adjacent index ranges are never coalesced.** Every item in that innermost `Vec` already shares pipeline, bind group, vertex buffer *and* index buffer, and their `indices_start_row..end_row` are row ranges into the *same* index array. If item A ends where B starts, one `draw_indexed` over the union is byte-identical output. A body with 200 same-coloured faces is 200 draws that could be 1.\n2. **`set_vertex_buffer(1, normals)` is re-issued per item** (`shaded_stage.rs:194-197`) even when every item in the bucket shares `normals_id` \u2014 it sits *below* the level that determines it. Same for the scalar slot at `scalar_field_stage.rs:352-355`.\n3. **Zero 3D instancing** \u2014 every `draw_indexed(\u2026, 0..1)` draws exactly one copy.\n\n## 3. Instancing: the blocker, and one thing that is already solved\n\nInstancing = one draw renders N copies of the same geometry, with per-copy data (transform, colour) from a separate buffer. It is the answer when a mesh repeats: bolts, brackets, identical component types, sensor spheres.\n\n**Already solved:** `GraphicsArray.__hash__`/`__eq__` are **content-based** \u2014 `(data_hash, shape, dtype, buffer_type)` (`tools/graphics_api/graphics_array.py:70-80`) \u2014 so `remember_array` already collapses identical meshes to one `array_id`. Repeated components genuinely share arrays in the Avro today. No server-side dedup pass is needed first.\n\n**The blocker is the map's nesting order.** `ItemKey` sits *above* `vertices_id` (`render_list.rs:119-131`). Instances differ precisely by transform and colour, so they get different `ItemKey`s and are scattered across sibling buckets \u2014 one bind group and one draw each. The data holds the instances; the traversal hides them. Fixing it means inverting the nest: group by geometry, collect the `(transform, colour)` set into a per-instance buffer, issue `0..N`.\n\nTwo ways to feed per-instance data:\n\n- **Storage buffer indexed by `instance_index`** \u2014 the clean design, **unavailable on WebGL2** (no vertex-stage storage buffers under `downlevel_webgl2_defaults`).\n- **Per-instance vertex attributes** \u2014 `VertexStepMode::Instance`, 4 \u00d7 `vec4` for the matrix + 1 for colour = 5 of WebGL2's 16 guaranteed slots. **Works today**, and this repo proves it: `overlay_pass.rs:125` uses `step_mode: Instance` and ships (`:296` draws 6 verts \u00d7 N rects in one call).\n\nCheapest wins outside the model stages: sensors are 2 draws + 2 uniform writes *per sensor* over one shared unit sphere (`sensor_stage.rs:349-352`) \u2192 2 draws total; the triad's 10 parts already share one vertex/index buffer and differ only by colour \u2192 1\u20132 draws.\n\n## 4. Measure the payoff before writing any of it\n\n`--split-items K` in `synth_bench.py` is the **exact inverse of range merging**: it cuts one item's row range into K items \u2014 same bytes, same pixels, K\u00d7 the draws. The curve it produces *is* the merging payoff curve, read backwards.\n\nSweep `--split-items 1 \u2192 2 \u2192 4 \u2192 16 \u2192 64` at fixed bytes and plot frame time. The slope is the per-draw cost on the target hardware. If 64\u00d7 the draws barely moves frame time, merging is not the bottleneck and P2 (streaming upload) should come first. If it is linear and steep, merging is the cheapest large win in the codebase. Adding `--instances N` layers bind-group churn on top; the gap between the two curves is how much of the cost is rebinding versus the draw itself. This is exactly the question P1 exists to answer \u2014 see [05_benchmark_and_limits.md](05_benchmark_and_limits.md).\n\n---\n\n## A. Range coalescing + hoisting the normals rebind\n\nNew helper in `render_list.rs`:\n\n```rust\n/// One `draw_indexed` covering a run of items that share everything a draw call depends on.\npub struct CoalescedDraw {\n    pub normals_id: ArrayId,\n    pub start_row: i64,\n    pub end_row: i64,\n}\n\nimpl CoalescedDraw {\n    pub fn get_flat_index_range(&self, n_vertices_per_elem: u32) -> std::ops::Range<u32> {\n        let start = n_vertices_per_elem * u32::try_from(self.start_row).unwrap();\n        let end = n_vertices_per_elem * u32::try_from(self.end_row).unwrap();\n        start..end\n    }\n}\n\n/// Collapses items in one `render_map` bucket into the fewest possible draw calls.\n///\n/// Everything in a bucket already shares stage, pipeline, bind group, vertex buffer and index\n/// buffer, so two items whose index-row ranges are *exactly* adjacent can be drawn as one:\n/// the triangles and their order are unchanged, and they read the same `ItemData`.\n///\n/// Grouped by `normals_id` first because that feeds vertex slot 1, so it must be equal across a\n/// merged draw. Only exactly-adjacent ranges are merged, never overlapping ones \u2014 drawing an\n/// overlap once instead of twice would change the result under alpha blending.\npub fn coalesce_draws(render_items: &[RenderItem]) -> Vec<CoalescedDraw> {\n    let mut rows_by_normals: std::collections::BTreeMap<ArrayId, Vec<(i64, i64)>> = Default::default();\n    for render_item in render_items {\n        rows_by_normals\n            .entry(render_item.normals_id)\n            .or_default()\n            .push((render_item.indices_start_row, render_item.indices_end_row));\n    }\n\n    let mut draws = Vec::new();\n    for (normals_id, mut ranges) in rows_by_normals {\n        ranges.sort_unstable();\n        let mut ranges = ranges.into_iter();\n        let Some((mut start_row, mut end_row)) = ranges.next() else {\n            continue;\n        };\n        for (next_start, next_end) in ranges {\n            if next_start == end_row {\n                end_row = next_end;\n            } else {\n                draws.push(CoalescedDraw { normals_id, start_row, end_row });\n                start_row = next_start;\n                end_row = next_end;\n            }\n        }\n        draws.push(CoalescedDraw { normals_id, start_row, end_row });\n    }\n    draws\n}\n```\n\nInnermost loop of `shaded_stage.rs::set_render_bundle` becomes:\n\n```rust\n                        for (indices_id, render_items) in indices_map {\n                            let (n_vertices_per_elem, index_format) =\n                                render_list.get_indices_format(indices_id);\n                            render_bundle_encoder.set_index_buffer(\n                                render_list.get_buffer_slice(indices_id),\n                                index_format,\n                            );\n\n                            debug_assert!(render_items.iter().all(|item| {\n                                item.render_stage == *render_stage\n                                    && item.vertices_id == *vertices_id\n                                    && item.indices_id == *indices_id\n                            }));\n\n                            let mut last_normals_id: Option<render_list::ArrayId> = None;\n                            for draw in render_list::coalesce_draws(render_items) {\n                                // Hoisted: slot 1 only needs rebinding when normals actually\n                                // change, not once per item.\n                                if last_normals_id != Some(draw.normals_id) {\n                                    render_bundle_encoder.set_vertex_buffer(\n                                        1,\n                                        render_list.get_buffer_slice(&draw.normals_id),\n                                    );\n                                    last_normals_id = Some(draw.normals_id);\n                                }\n                                render_bundle_encoder.draw_indexed(\n                                    draw.get_flat_index_range(n_vertices_per_elem),\n                                    0,\n                                    0..1,\n                                );\n                            }\n                        }\n```\n\n`ArrayId` is currently a private `type` alias \u2014 needs `pub type ArrayId = i32;`. The same edit applies verbatim to `translucent_stage.rs` (no slot 1), `scalar_field_stage.rs` (group by `scalar_values_id` instead of `normals_id`), and `pick_stage.rs`.\n\n## B. Deterministic draw order\n\n`render_list.rs` \u2014 swap the map type and give `ItemKey` an ordering:\n\n```rust\ntype RenderMap = std::collections::BTreeMap<\n    RenderStage,\n    std::collections::BTreeMap<\n        u32,\n        std::collections::BTreeMap<\n            ItemKey,\n            (\n                std::rc::Rc<wgpu::BindGroup>,\n                std::collections::BTreeMap<ArrayId, std::collections::BTreeMap<ArrayId, Vec<RenderItem>>>,\n            ),\n        >,\n    >,\n>;\n\n// RenderStage needs Ord too:\n#[derive(Eq, PartialEq, Ord, PartialOrd, Hash, Clone, Copy, Debug, serde::Deserialize)]\npub enum RenderStage { /* unchanged */ }\n\n/// Ordering is by raw bytes \u2014 arbitrary but *stable*, which is the whole point. Hashing floats\n/// is already done this way here (see `Hash`/`PartialEq`), so this stays consistent with it.\nimpl Ord for ItemKey {\n    fn cmp(&self, other: &Self) -> std::cmp::Ordering {\n        bytemuck::bytes_of(self).cmp(bytemuck::bytes_of(other))\n    }\n}\n\nimpl PartialOrd for ItemKey {\n    fn partial_cmp(&self, other: &Self) -> Option<std::cmp::Ordering> {\n        Some(self.cmp(other))\n    }\n}\n```\n\nEverything downstream is iteration and `entry().or_default()`, which `BTreeMap` supports identically, so the stage loops need no change beyond this. This is what makes before/after benchmark frames comparable, and it removes the run-to-run variation in translucent blending (defect B1).\n\n## C. Instancing via per-instance vertex attributes\n\n### C1. Build batches where `ArrayBundle` is in scope (`render_list.rs`)\n\n```rust\n/// Identifies geometry that can be drawn in one instanced call: everything except the\n/// per-instance transform and colour.\n#[derive(Eq, PartialEq, Ord, PartialOrd, Clone, Copy, Debug)]\npub struct GeometryKey {\n    pub render_stage: RenderStage,\n    pub n
