_vertices_per_elem: u32,\n    pub vertices_id: ArrayId,\n    pub indices_id: ArrayId,\n    pub normals_id: ArrayId,\n    pub start_row: i64,\n    pub end_row: i64,\n}\n\n/// Per-instance data, laid out for a `VertexStepMode::Instance` buffer.\n///\n/// `model_from_local` is column-major (`glam::Mat4::to_cols_array`), so four consecutive\n/// `vec4`s reconstruct it with `mat4x4<f32>(m0, m1, m2, m3)` in WGSL.\n#[repr(C)]\n#[derive(Clone, Copy, bytemuck::Pod, bytemuck::Zeroable)]\npub struct InstanceRaw {\n    pub model_from_local: [f32; 16],\n    pub color: [f32; 4],\n}\n\nimpl InstanceRaw {\n    const ATTRS: [wgpu::VertexAttribute; 5] = wgpu::vertex_attr_array![\n        2 => Float32x4, 3 => Float32x4, 4 => Float32x4, 5 => Float32x4, 6 => Float32x4\n    ];\n\n    pub fn get_layout<'a>() -> wgpu::VertexBufferLayout<'a> {\n        wgpu::VertexBufferLayout {\n            array_stride: std::mem::size_of::<Self>() as wgpu::BufferAddress,\n            step_mode: wgpu::VertexStepMode::Instance,\n            attributes: &Self::ATTRS,\n        }\n    }\n}\n\npub struct InstancedBatch {\n    pub instance_buffer: wgpu::Buffer,\n    pub n_instances: u32,\n}\n\npub type InstancedMap = std::collections::BTreeMap<GeometryKey, InstancedBatch>;\n```\n\nBuilt once, alongside `render_map`, inside `RenderList::new` \u2014 the only place `ArrayBundle::get_array_mat4` is reachable:\n\n```rust\n        // Repeated geometry already shares one array_id: GraphicsArray's Hash/Eq are\n        // content-based (data_hash + shape + dtype + buffer_type), so `remember_array` on the\n        // Python side dedups identical meshes. Items that differ only by transform/colour\n        // therefore land on the same GeometryKey here.\n        let mut key_to_instances: std::collections::BTreeMap<GeometryKey, Vec<InstanceRaw>> = Default::default();\n        for render_item in &render_items {\n            let indices_array = array_bundle.get_array(render_item.indices_id)?;\n            let n_vertices_per_elem = u32::try_from(indices_array.array_descriptor.shape[1]).unwrap();\n            let model_from_local = if render_item.model_from_local_id == -1 {\n                glam::Mat4::IDENTITY\n            } else {\n                array_bundle.get_array_mat4(render_item.model_from_local_id)?\n            };\n            let color = match render_item.color.len() {\n                4 => glam::Vec4::from_slice(&render_item.color),\n                0 => glam::Vec4::new(1.0, 0.0, 0.0, 1.0),\n                _ => return Err(anyhow::anyhow!(\"invalid color length\")),\n            };\n            let key = GeometryKey {\n                render_stage: render_item.render_stage,\n                n_vertices_per_elem,\n                vertices_id: render_item.vertices_id,\n                indices_id: render_item.indices_id,\n                normals_id: render_item.normals_id,\n                start_row: render_item.indices_start_row,\n                end_row: render_item.indices_end_row,\n            };\n            key_to_instances.entry(key).or_default().push(InstanceRaw {\n                model_from_local: model_from_local.to_cols_array(),\n                color: color.to_array(),\n            });\n        }\n\n        let instanced_map: InstancedMap = key_to_instances\n            .into_iter()\n            .map(|(key, instances)| {\n                let instance_buffer = device.create_buffer_init(&wgpu::util::BufferInitDescriptor {\n                    label: Some(\"instance_buffer\"),\n                    contents: bytemuck::cast_slice(&instances),\n                    usage: wgpu::BufferUsages::VERTEX,\n                });\n                (key, InstancedBatch { instance_buffer, n_instances: instances.len() as u32 })\n            })\n            .collect();\n```\n\nCoalescing (A) still applies *before* this: merge adjacent rows within a `(transform, colour)` group first, then instance the merged geometry.\n\n### C2. Shader\n\n`FRAME_WGSL` must be split, because the instanced pipeline has no group 2, and a *declared* `item_data` binding absent from the pipeline layout is a pipeline-creation error:\n\n```rust\n/// FRAME_WGSL minus the `@group(2)` item_data binding \u2014 camera, globals and should_clip only.\npub const INSTANCED_FRAME_WGSL: &str = r#\"\n// ... camera @group(0) @binding(0), globals @group(0) @binding(1), fn should_clip(...) ...\n\"#;\n\npub const INSTANCED_FLAT_WGSL: &str = r#\"\nstruct InstanceIn {\n  @location(2) m0: vec4<f32>,\n  @location(3) m1: vec4<f32>,\n  @location(4) m2: vec4<f32>,\n  @location(5) m3: vec4<f32>,\n  @location(6) color: vec4<f32>,\n};\n\nstruct VertexOut {\n  @builtin(position) vertex_in_ndc: vec4<f32>,\n  @location(0) vertex_in_model: vec4<f32>,\n  @location(1) color: vec4<f32>,\n};\n\n@vertex\nfn vs_main(@location(0) vertex_in_local: vec3<f32>, instance: InstanceIn) -> VertexOut {\n  let model_from_local = mat4x4<f32>(instance.m0, instance.m1, instance.m2, instance.m3);\n  var vertex_out: VertexOut;\n  vertex_out.vertex_in_model = model_from_local * vec4<f32>(vertex_in_local, 1.0);\n  vertex_out.vertex_in_ndc = camera.ndc_from_model * vertex_out.vertex_in_model;\n  vertex_out.color = instance.color;\n  return vertex_out;\n}\n\n@fragment\nfn fs_main(@location(0) vertex_in_model: vec4<f32>, @location(1) color: vec4<f32>) -> @location(0) vec4<f32> {\n  if (should_clip(vertex_in_model)) {\n    discard;\n  }\n  return color;\n}\n\"#;\n```\n\n### C3. Pipeline layout and vertex buffers\n\n```rust\n        // Groups 0 and 1 only: per-item uniforms are gone, so there is no group 2 to bind.\n        // Mirrors how TriadStage substitutes its own layout rather than reusing the shared one.\n        let instanced_pipeline_layout = device.create_pipeline_layout(&wgpu::PipelineLayoutDescriptor {\n            label: Some(\"instanced_pipeline_layout\"),\n            bind_group_layouts: &[&frame_bind_group_layout, &empty_bind_group_layout],\n            push_constant_ranges: &[],\n        });\n```\n\n```rust\n            vertex: wgpu::VertexState {\n                module: &shader_module,\n                entry_point: Some(\"vs_main\"),\n                buffers: &[\n                    Vertex::get_layout(),                   // slot 0, per-vertex positions\n                    Normal::get_layout(),                   // slot 1, per-vertex normals (shaded only)\n                    render_list::InstanceRaw::get_layout(), // slot 2, per-instance\n                ],\n                compilation_options: Default::default(),\n            },\n```\n\n### C4. Encode loop \u2014 flat, one draw per geometry\n\n```rust\n        render_bundle_encoder.set_bind_group(0, frame_bind_group, &[]);\n        let mut last_n_vertices_per_elem = None;\n        for (key, batch) in &render_list.instanced_map {\n            if key.render_stage != render_list::RenderStage::ShadedRenderStage {\n                continue;\n            }\n            if last_n_vertices_per_elem != Some(key.n_vertices_per_elem) {\n                match key.n_vertices_per_elem {\n                    2 => render_bundle_encoder.set_pipeline(&self.shaded_edge_pipeline),\n                    3 => render_bundle_encoder.set_pipeline(&self.shaded_triangle_pipeline),\n                    _ => return Err(anyhow::anyhow!(\"unsupported n_vertices_per_elem\")),\n                }\n                last_n_vertices_per_elem = Some(key.n_vertices_per_elem);\n            }\n            render_bundle_encoder.set_vertex_buffer(0, render_list.get_buffer_slice(&key.vertices_id));\n            render_bundle_encoder.set_vertex_buffer(1, render_list.get_buffer_slice(&key.normals_id));\n            render_bundle_encoder.set_vertex_buffer(2, batch.instance_buffer.slice(..));\n            let (n_vertices_per_elem, index_format) = render_list.get_indices_format(&key.indices_id);\n            render_bundle_encoder.set_index_buffer(\n                render_list.get_buffer_slice(&key.indices_id),\n                index_format,\n            );\n            let start = n_vertices_per_elem * u32::try_from(key.start_row).unwrap();\n            let end = n_vertices_per_elem * u32::try_from(key.end_row).unwrap();\n            render_bundle_encoder.draw_indexed(start..end, 0, 0..batch.n_instances);\n        }\n```\n\nBecause `GeometryKey` sorts on `render_stage` and `n_vertices_per_elem` first, a `BTreeMap` walk groups pipeline switches naturally \u2014 no nesting needed.\n\n## 5. Caveats on the above\n\n- **5 of 16 attribute slots.** WebGL2 guarantees 16; this uses 0\u20131 for vertex data and 2\u20136 for instance data. Proven in-repo by `overlay_pass.rs`.\n- **`_get_buffer_slice` unwraps**, so `normals_id == -1` panics (defect B4, `render_list.rs:842`). The instanced path makes it worse by hoisting the bind unconditionally \u2014 needs a real fix first, e.g. a zero-filled placeholder normals array.\n- **`ItemKey`, `ItemBuffers` and the per-item uniform buffers become dead** for converted stages. `sensor_stage` and `triad_stage` keep using `ItemData`, so `ItemData` and group 2 stay.\n- **The pick stage benefits for free** \u2014 its id lives in `color`, now a per-instance attribute, so one draw covers many distinct ids.\n- **A and B are safe refactors; C changes the wire-to-GPU path and the shader.** Do A and B, measure with `--split-items`, then decide C.\n"}, {"id": "SUMMARY", "title": "Research: summary", "md": "# Web-Based BIM Viewer \u2014 Findings & Wrap-Up\n\n_Research summary. Goal: build our own web-based BIM viewer / BI app (like VCAD and bimframe.co / \"Frame\")._\n\n## What we set out to understand\n1. What makes BIM software different from a 3D game engine and a 3D modeling app.\n2. Where OpenGL / WebGL / WebGPU sit in that picture.\n3. How web viewers (VCAD, Frame) load huge models so smoothly.\n4. How to handle memory limits (the \"2 GB\" question).\n5. How the load/render pipeline actually works (LOD, coarse proxies, streaming).\n\n## The core conclusions\n\n**1. BIM = a queryable information model that happens to have 3D.**\nA modeling app stores what a building *looks like*; a game engine stores how a scene *behaves in real time*; BIM stores what a building *is*. Geometry is the least important part \u2014 the value is the semantic data.\n\n**2. Three independent axes (don't confuse them).**\n- *Semantic maturity*: modeling app -> game engine -> BIM (how much meaning the model carries).\n- *Rendering stack*: Hardware -> Driver -> Graphics API -> Engine -> App.\n- *API generation*: OpenGL (1992) -> WebGL (2011) -> WebGPU (2023+).\nOpenGL/WebGL/WebGPU are the **Graphics API layer** \u2014 the shared substrate EVERYTHING renders through. They are NOT alternatives to BIM/engine software.\n\n**3. The litmus test for \"is it BIM or just 3D?\"**\nCan you ask the model a question and get a *data* answer, and does clicking geometry reveal structured attributes? Yes -> BIM. Only renders form -> 3D.\n\n**4. Viewer/BI class vs authoring class.**\nWe are building the viewer/BI class (VCAD, Frame) = 3D + queryable semantic graph. NOT the authoring class (Revit) = a parametric/constraint engine (company-scale effort).\n\n**5. Smoothness comes from loading LESS, not packing MORE.**\nWeb viewers are smooth because they never hold the whole model. Model size and VRAM usage are DECOUPLED via streaming + LOD + culling + instancing + eviction. The resident working set stays ~1-2 GB regardless of total model size.\n\n**6. The one architectural rule.**\nTwo worlds on two clocks: a render/input loop that NEVER stalls, and an async loader (fetch -> worker-decode -> time-budgeted upload -> evict) feeding it through a queue.\n\n**7. The \"2 GB\" limit is mostly a non-issue.**\n- Source file size != GPU footprint (instancing + quantization + compression shrink it a lot).\n- You don't hold the whole model resident anyway (streaming).\n- The 2 GB cap is per single GPUBuffer, not per device or per VRAM. Use many small per-batch buffers and you never hit it.\n\n## Architecture in one paragraph\nA web BIM viewer is a 3D scene acting as a visual index into a queryable semantic graph. A server pre-tessellates, instances, compresses, and tiles the model; the browser runs two decoupled worlds (never-stalling render loop + async loader) and uses instancing, culling, LOD, and coarse proxies (all gated by screen-space error) to draw only the visible slice. What makes it BIM rather than 3D is the semantic layer: every element carries a stable ID, type, property sets, and relationships you can filter, aggregate, and chart.\n\n## Recommended open-source stack\n- **web-ifc / That Open Engine** \u2014 parse IFC, get geometry + semantic graph (+ Fragments streaming).\n- **xeokit-sdk** \u2014 reference implementation for large BIM models (study its code).\n- **three.js + WebGPU** \u2014 renderer (WebGPU for low draw-call overhead).\n- **3D Tiles / CesiumJS** \u2014 streaming standard.\n- **meshoptimizer / Draco / glTF** \u2014 compression + LOD generation.\n- **IfcOpenShell** \u2014 server-side pre-processing.\n- **buildingSMART IFC spec** \u2014 the data model.\n\n## Key gotcha to handle early\nReal-world survey coordinates cause float32 jitter/wobble -> use double-precision / relative-to-center (RTC) rendering (see how xeokit/Cesium do it).\n\n## Next step\nBuild the foundation: web-ifc + three.js rendering a small IFC with a semantic tree + click-to-data. Then add the query/dashboard layer (the thing that makes it BIM), then performance (instancing -> culling -> LOD -> streaming).\n"}, {"id": "MISCONCEPTIONS_AND_FAQ", "title": "Research: misconceptions", "md": "# BIM & Web 3D \u2014 Common Misconceptions and FAQ\n\nA plain-language guide to the wrong ideas people (understandably) have about BIM software and web-based 3D, and what's actually true.\n\n## Misconceptions (myth -> reality)\n\n**Myth 1: \"BIM is just 3D modeling software for buildings.\"**\nReality: BIM is a *queryable information database* that happens to have a 3D view. The 3D is an index into the data. Strip the data out and it collapses into an ordinary 3D viewer.\n\n**Myth 2: \"OpenGL / WebGL / WebGPU are alternatives to game engines or BIM software.\"**\nReality: They are a *lower layer* \u2014 the graphics API that draws pixels. Modeling apps, game engines, and BIM software ALL render through them. They carry zero semantic meaning.\n\n**Myth 3: \"A 3D viewer plus a structure tree automatically becomes BIM software.\"**\nReality: Only if the tree is *populated* with real, linked, queryable data (types, property sets, relationships) AND geometry<->data selection works both ways. A hollow tree with labels is still just 3D.\n\n**Myth 4: \"Building a BIM viewer means building Revit.\"**\nReality: Two different classes. A *viewer/BI tool* (VCAD, Frame) reads and analyzes BIM \u2014 a weeks-to-months project. An *authoring tool* (Revit) creates BIM and needs a parametric/constraint engine \u2014 a company-scale effort.\n\n**Myth 5: \"Web viewers are smooth because they load the whole model into VRAM.\"**\nReality: The opposite. They are smooth because they load as LITTLE as possible \u2014 streaming only the visible slice, using LOD, culling, and eviction. Model size and VRAM usage are decoupled.\n\n**Myth 6: \"The ~4 GB JavaScript heap limit caps how big a model I can load.\"**\nReality: Geometry lives in ArrayBuffers / WASM linear memory \u2014 a *separate* allocator from the V8 object heap. The JS heap limit is not your geometry ceiling.\n\n**Myth 7: \"The 2 GB WebGPU limit is a spec-wide / per-device / per-VRAM cap.\"**\nReality: It's the max size of a *single* GPUBuffer, and it's adapter-dependent (the spec DEFAULT is only 256 MB; you raise it via requiredLimits). You can allocate many buffers up to total VRAM. Use many small per-batch buffers and you never hit it.\n\n**Myth 8: \"A model bigger than 2 GB can't be stored or rendered in a browser.\"**\nReality: It can. Instancing + quantization + compression usually shrink a 2 GB source to a few hundred MB of GPU data, and streaming keeps the resident set small regardless of total size.\n\n**Myth 9: \"When I zoom out, it loads and renders the whole model at full detail.\"**\nReality: No. LOD swaps tiny elements for coarse proxies (or drops them below a pixel threshold), and occlusion culling hides the interior. Zoom-out is often SMOOTHER than a mid-distance view.\n\n**Myth 10: \"Triangle count / FPS is the right way to measure a BIM model's limits.\"**\nReality: Partly. The real BIM bottleneck is *element count -> draw calls* and *data volume*, not triangles. 8 M triangles as 400k draw calls is far harder than 20 M triangles as 500 draw calls.\n\n**Myth 11: \"I have to build the IFC parser and streaming engine myself.\"**\nReality: The whole stack is open source: web-ifc / That Open Engine (parsing), xeokit (large-model rendering), 3D Tiles / Cesium (streaming), meshoptimizer / Draco (compression).\n\n**Myth 12: \"Coarse proxies are computed live in the browser.\"**\nReality: Mostly generated once, offline, on the server as an LOD chain. The browser just downloads the level it needs. (Bounding boxes are cheap enough to do live; mesh decimation is not.)\n\n**Myth 13: \"DoF (degrees of freedom / depth of field) measures how much a 3D model is limited.\"**\nReality: Wrong metric. Capacity is measured by triangles/frame, draw calls, element count, VRAM, and frame-time percentiles (1% lows), not DoF.\n\n## FAQ\n\n**Q: What is the single most important thing to get right?**\nA: Decouple the render/input loop from the loader so the frame NEVER stalls. It's structural and painful to retrofit \u2014 build it first.\n\n**Q: What gives the biggest performance win in a BIM viewer?**\nA: Instancing + geometry merging, because the bottleneck is draw-call count, not triangles.\n\n**Q: How do these viewers appear to load instantly?**\nA: Progressive loading \u2014 show coarse proxies (blocks) immediately, then stream in and swap for real geometry, prioritizing what's in view. Much of \"fast\" is \"never made you stare at nothing.\"\n\n**Q: What decides when to show a coarse proxy vs full detail?**\nA: Screen-space error (SSE): roughly (geometricError * screenHeight) / (2 * distance * tan(fov/2)). If the visual error would be below a pixel threshold, use the coarse version.\n\n**Q: What is a coarse proxy?**\nA: A cheap low-detail stand-in for an element (bounding box, decimated mesh, merged blob) used when full detail isn't worth drawing \u2014 far away, tiny on screen, or still loading.\n\n**Q: WebGL or WebGPU?**\nA: WebGPU. Lower draw-call overhead, compute shaders, modern GPU features \u2014 and draw-call overhead is exactly the BIM bottleneck.\n\n**Q: What is the BIM-specific rendering gotcha?**\nA: Buildings placed at real-world survey coordinates cause float32 jitter. Fix it with double-precision / relative-to-center (RTC) rendering.\n\n**Q: Full-load or streaming architecture?**\nA: Full-load (whole model resident) is simpler and fine if models fit in memory. Streaming (view + LOD) scales to unbounded models but you build the tiling/eviction machinery. Choose based on your target model sizes.\n"}], "diagrams": [{"id": "diag_load", "title": "Load path (sequence)", "svg": "\n<svg viewBox=\"0 0 980 640\" xmlns=\"http://www.w3.org/2000/svg\" class=\"diagram\">\n  <style>\n    .lane { fill: #f4f6f8; stroke: #c9d1d9; }\n    .lane-label { font: 600 12px system-ui; fill: #24292f; }\n    .lifeline { stroke: #c9d1d9; stroke-dasharray: 4 4; }\n    .msg { stroke: #24292f; fill: none; marker-end: url(#arrow); }\n    .msg-blocked { stroke: #b42318; }\n    .lbl { font: 11px ui-monospace, monospace; fill: #24292f; }\n    .lbl-bad { font: 11px ui-monospace, monospace; fill: #b42318; }\n    .note { font: 11px system-ui; fill: #57606a; }\n    .freeze { fill: #fdecea; stroke: #b42318; }\n    .ok { fill: #e6f4ea; stroke: #1a7f37; }\n  </style>\n  <defs>\n    <marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"aut >\n  <text x=\"460\" y=\"224\" class=\"lbl-bad\">push_chunk + md5 (8 MiB each)</text>\n  <text x=\"660\" y=\"234\" class=\"note\">copy 1: unmerged_chunks</text>\n\n  <path class=\"msg msg-blocked\" d=\"M450,275 L645,275\"/>\n  <text x=\"460\" y=\"269\" class=\"lbl-bad\">finalize_chunks (needs ALL)</text>\n  <text x=\"660\" y=\"279\" class=\"note\">copy 2: concatenated blob</text>\n\n  <path class=\"msg msg-blocked\" d=\"M450,320 L645,320\"/>\n  <text x=\"460\" y=\"314\" class=\"lbl-bad\">avro parse -> descriptors</text>\n\n  <path class=\"msg msg-blocked\" d=\"M650,365 L845,365\"/>\n  <text x=\"660\" y=\"359\" class=\"lbl-bad\">create_buffer_init(whole blob)</text>\n  <text x=\"600\" y=\"392\" class=\"note\">copy 3: staging  =&gt;  peak ~3x geometry</text>\n\n  <path class=\"msg msg-blocked\" d=\"M450,430 L845,430\"/>\n  <text x=\"460\" y=\"424\" class=\"lbl-bad\">first frame forced (web_app.rs:312)</text>\n\n  <path class=\"msg\" d=\"M80,470 L255,470\" opacity=\"0.35\"/>\n  <text x=\"90\" y=\"464\" class=\"note\">progress reported 100% here \u2014 BEFORE finalize+upload (B2)</text>\n\n  <text x=\"10\" y=\"520\" class=\"lane-label\">After P2 \u2014 pre-allocate from array_descriptors, write_buffer per chunk</text>\n  <rect class=\"ok\" x=\"400\" y=\"536\" width=\"100\" height=\"46\" rx=\"4\" opacity=\"0.35\"/>\n  <text x=\"404\" y=\"552\" class=\"lbl\">peak =</text>\n  <text x=\"404\" y=\"565\" class=\"lbl\">1 chunk</text>\n  <path class=\"msg\" d=\"M450,556 L845,556\"/>\n  <text x=\"460\" y=\"550\" class=\"lbl\">write_buffer(offset, chunk) as each lands</text>\n  <text x=\"500\" y=\"596\" class=\"note\">sizes+offsets are known up front from array_descriptors, so no concat and no staging copy</text>\n</svg>\n"}, {"id": "diag_pick", "title": "Click-to-data (sequence)", "svg": "\n<svg viewBox=\"0 0 980 470\" xmlns=\"http://www.w3.org/2000/svg\" class=\"diagram\">\n  <style>\n    .lane { fill: #f4f6f8; stroke: #c9d1d9; }\n    .lane-label { font: 600 12px system-ui; fill: #24292f; }\n    .lifeline { stroke: #c9d1d9; stroke-dasharray: 4 4; }\n    .msg { stroke: #24292f; fill: none; marker-end: url(#arrow2); }\n    .lbl { font: 11px ui-monospace, monospace; fill: #24292f; }\n    .note { font: 11px system-ui; fill: #57606a; }\n    .done { fill: #e6f4ea; stroke: #1a7f37; }\n    .todo { fill: #fff8e1; stroke: #9a6700; }\n  </style>\n  <defs>\n    <marker id=\"arrow2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"#24292f\"/>\n    </marker>\n  </defs>\n  <text x=\"10\" y=\"18\" class=\"lane-label\">Click-to-data \u2014 green = built on branch wgpu-pick-semantic, amber = remaining</text>\n\n  <rect class=\"lane\" x=\"20\"  y=\"34\" width=\"130\" height=\"26\" rx=\"4\"/><text x=\"34\" y=\"51\" class=\"lane-label\">HUI export (py)</text>\n  <rect class=\"lane\" x=\"220\" y=\"34\" width=\"130\" height=\"26\" rx=\"4\"/><text x=\"243\" y=\"51\" class=\"lane-label\">React host</text>\n  <rect class=\"lane\" x=\"420\" y=\"34\" width=\"150\" height=\"26\" rx=\"4\"/><text x=\"440\" y=\"51\" class=\"lane-label\">wasm renderer</text>\n  <rect class=\"lane\" x=\"640\" y=\"34\" width=\"150\" height=\"26\" rx=\"4\"/><text x=\"660\" y=\"51\" class=\"lane-label\">pick texture</text>\n  <rect class=\"lane\" x=\"840\" y=\"34\" width=\"120\" height=\"26\" rx=\"4\"/><text x=\"856\" y=\"51\" class=\"lane-label\">properties UI</text>\n\n  <line class=\"lifeline\" x1=\"85\"  y1=\"60\" x2=\"85\"  y2=\"440\"/>\n  <line class=\"lifeline\" x1=\"285\" y1=\"60\" x2=\"285\" y2=\"440\"/>\n  <line class=\"lifeline\" x1=\"495\" y1=\"60\" x2=\"495\" y2=\"440\"/>\n  <line class=\"lifeline\" x1=\"715\" y1=\"60\" x2=\"715\" y2=\"440\"/>\n  <line class=\"lifeline\" x1=\"900\" y1=\"60\" x2=\"900\" y2=\"440\"/>\n\n  <rect class=\"done\" x=\"30\" y=\"80\" width=\"110\" height=\"34\" rx=\"4\"/>\n  <text x=\"38\" y=\"95\" class=\"lbl\">pick_ref -&gt;</text>\n  <text x=\"38\" y=\"108\" ystem-ui; fill: #57606a; }\n    .note { font: 11px system-ui; fill: #57606a; }\n    .gap { fill: #fff8e1; stroke: #9a6700; stroke-dasharray: 4 3; }\n  </style>\n  <defs>\n    <marker id=\"crow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\n      <path d=\"M0,0 L10,5 L0,10\" fill=\"none\" stroke=\"#57606a\"/>\n    </marker>\n  </defs>\n  <text x=\"10\" y=\"18\" class=\"ent-name\">Wire format (render_group.avro) and where identity is lost</text>\n\n  <!-- RenderGroup -->\n  <g>\n    <rect class=\"hdr\" x=\"20\" y=\"40\" width=\"200\" height=\"22\" rx=\"3\"/>\n    <text x=\"28\" y=\"56\" class=\"ent-name\">RenderGroup</text>\n    <rect class=\"ent\" x=\"20\" y=\"62\" width=\"200\" height=\"58\"/>\n    <text x=\"28\" y=\"78\" class=\"fld\">render_items[]</text>\n    <text x=\"28\" y=\"94\" class=\"fld\">array_descriptors[]</text>\n    <text x=\"28\" y=\"110\" class=\"fld\">array_chunks[]?</text>\n  </g>\n\n  <!-- RenderItem -->\n  <g>\n    <rect class=\"hdr\" x=\"300\" y=\"40\" width=\"240\" height=\"22\" rx=\"3\"/>\n    <text x=\"308\" y=\"56\" class=\"ent-name\">RenderItem</text>\n    <rect class=\"ent\" x=\"300\" y=\"62\" width=\"240\" height=\"140\"/>\n    <text x=\"308\" y=\"78\" class=\"fld\">render_stage (8 variants, 5 dead)</text>\n    <text x=\"308\" y=\"94\" class=\"fld\">vertices_id / indices_id  -&gt; array</text>\n    <text x=\"308\" y=\"110\" class=\"fld\">normals_id / scalar_values_id</text>\n    <text x=\"308\" y=\"126\" class=\"fld\">model_from_local_id -&gt; array</text>\n    <text x=\"308\" y=\"142\" class=\"fld\">color[4]</text>\n    <text x=\"308\" y=\"158\" class=\"fld\">indices_start_row / end_row</text>\n    <text x=\"308\" y=\"174\" class=\"fld\">primitive_size, should_clip</text>\n    <text x=\"308\" y=\"192\" class=\"note\">no id, no name, no type, no parent</text>\n  </g>\n\n  <!-- ArrayDescriptor -->\n  <g>\n    <rect class=\"hdr\" x=\"620\" y=\"40\" width=\"230\" height=\"22\" rx=\"3\"/>\n    <text x=\"628\" y=\"56\" class=\"ent-name\">ArrayDescriptor</text>\n    <rect class=\"ent\" x=\"620\" y=\"62\" width=\"230\" height=\"90\"/>\n    <text x=\"628\" y=\"78\" class=\"pk\">array_id  (PK)</text>\n    <text x=\"628\" y=\"94\" class=\"fld\">dtype: Float32|Uint16|Uint32</text>\n    <text x=\"628\" y=\"110\" class=\"fld\">shape[]</text>\n    <text x=\"628\" y=\"126\" class=\"fld\">buffer_type: Vertex|Index|</text>\n    <text x=\"628\" y=\"142\" class=\"fld\">              Scalar|Other</text>\n  </g>\n  <text x=\"620\" y=\"172\" class=\"note\">list ORDER is load-bearing: offsets</text>\n  <text x=\"620\" y=\"186\" class=\"note\">accumulate in list order</text>\n\n  <!-- ArrayChunk -->\n  <g>\n    <rect class=\"hdr\" x=\"620\" y=\"215\" width=\"230\" height=\"22\" rx=\"3\"/>\n    <text x=\"628\" y=\"231\" class=\"ent-name\">ArrayChunk</text>\n    <rect class=\"ent\" x=\"620\" y=\"237\" width=\"230\" height=\"58\"/>\n    <text x=\"628\" y=\"253\" class=\"fld\">name (.partNNN)</text>\n    <text x=\"628\" y=\"269\" class=\"fld\">size</text>\n    <text x=\"628\" y=\"285\" class=\"fld\">checksum (md5)</text>\n  </g>\n\n  <!-- ItemKey -->\n  <g>\n    <rect class=\"hdr\" x=\"300\" y=\"250\" width=\"240\" height=\"22\" rx=\"3\"/>\n    <text x=\"308\" y=\"266\" class=\"ent-name\">ItemKey  (GPU-side, render_list.rs)</text>\n    <rect class=\"ent\" x=\"300\" y=\"272\" width=\"240\" height=\"58\"/>\n    <text x=\"308\" y=\"288\" class=\"fld\">model_from_local_id</text>\n    <text x=\"308\" y=\"304\" class=\"fld\">color</text>\n    <text x=\"308\" y=\"322\" class=\"note\">DEDUPES items -&gt; identity destroyed</text>\n  </g>\n\n  <!-- pick side -->\n  <g>\n    <rect class=\"hdr\" x=\"20\" y=\"380\" width=\"250\" height=\"22\" rx=\"3\"/>\n    <text x=\"28\" y=\"396\" class=\"ent-name\">graphics_face (HUI, python)</text>\n    <rect class=\"ent\" x=\"20\" y=\"402\" width=\"250\" height=\"58\"/>\n    <text x=\"28\" y=\"418\" class=\"pk\">pick_ref  (the real identity)</text>\n    <text x=\"28\" y=\"434\" class=\"fld\">color, primitive_size, render_type</text>\n    <text x=\"28\" y=\"450\" class=\"fld\">start_idx / end_idx</text>\n  </g>\n\n  <g>\n    <rect class=\"hdr\" x=\"330\" y=\"380\" width=\"230\" height=\"22\" rx=\"3\"/>\n    <text x=\"338\" y=\"396\" class=\"ent-name\">pick_color_map</text>\n    <rect class=\"ent\" x=\"330\" y=\"402\" width=\"230\" height=\"42\"/>\n    <text x=\"338\" y=\"418\" class=\"pk\">idx (random per export)</text>\n    <text x=\"338\" y=\"434\" class=\"fld\">-&gt; Pick</text>\n  </g>\n\n  <g>\n    <rect class=\"hdr\" x=\"620\" y=\"380\" width=\"230\" height=\"22\" rx=\"3\"/>\n    <text x=\"628\" y=\"396\" class=\"ent-name\">pick_map.json  (NEW)</text>\n    <rect class=\"ent\" x=\"620\" y=\"402\" width=\"230\" height=\"74\"/>\n    <text x=\"628\" y=\"418\" class=\"pk\">id  (= decoded pick colour)</text>\n    <text x=\"628\" y=\"434\" class=\"fld\">stable_id  (survives re-export)</text>\n    <text x=\"628\" y=\"450\" class=\"fld\">pick {code, component_id, ...}</text>\n    <text x=\"628\" y=\"466\" class=\"fld\">key_path[]  (the hierarchy)</text>\n  </g>\n\n  <g>\n    <rect class=\"gap\" x=\"330\" y=\"505\" width=\"520\" height=\"70\" rx=\"4\"/>\n    <text x=\"342\" y=\"527\" class=\"ent-name\">Still missing for \"it is BIM\"</text>\n    <text x=\"342\" y=\"547\" class=\"fld\">element_id on RenderItem  |  parent/child tree  |  property sets</text>\n    <text x=\"342\" y=\"565\" class=\"fld\">id -&gt; item index for highlight  |  query/aggregate layer</text>\n  </g>\n\n  <path class=\"rel\" d=\"M220,80 L295,80\"/><text x=\"228\" y=\"74\" class=\"rel-lbl\">1..N</text>\n  <path class=\"rel\" d=\"M220,96 L615,96\" opacity=\"0.5\"/><text x=\"440\" y=\"90\" class=\"rel-lbl\">1..N</text>\n  <path class=\"rel\" d=\"M220,112 L615,240\" opacity=\"0.5\"/>\n  <path class=\"rel\" d=\"M540,110 L615,100\"/><text x=\"548\" y=\"122\" class=\"rel-lbl\">FK array_id</text>\n  <path class=\"rel\" d=\"M420,205 L420,245\"/><text x=\"428\" y=\"228\" class=\"rel-lbl\">grouped by</text>\n  <path class=\"rel\" d=\"M270,425 L325,425\"/><text x=\"276\" y=\"419\" class=\"rel-lbl\">1..1</text>\n  <path class=\"rel\" d=\"M560,420 L615,420\"/><text x=\"566\" y=\"414\" class=\"rel-lbl\">serialised</text>\n  <path class=\"rel\" d=\"M420,378 L420,340\" opacity=\"0.6\"/>\n  <text x=\"428\" y=\"360\" class=\"rel-lbl\">colour carries idx</text>\n</svg>\n"}, {"id": "diag_knobs", "title": "Benchmark knobs & walls", "svg": "\n<svg viewBox=\"0 0 980 420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"diagram\">\n  <style>\n    .box { fill: #ffffff; stroke: #24292f; }\n    .hd { font: 600 12px system-ui; fill: #24292f; }\n    .fld { font: 11px ui-monospace, monospace; fill: #24292f; }\n    .note { font: 11px system-ui; fill: #57606a; }\n    .b1 { fill: #e7f0fd; stroke: #0969da; }\n    .b2 { fill: #fdecea; stroke: #b42318; }\n    .b3 { fill: #e6f4ea; stroke: #1a7f37; }\n    .axis { stroke: #57606a; marker-end: url(#a3); }\n  </style>\n  <defs>\n    <marker id=\"a3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"#57606a\"/>\n    </marker>\n  </defs>\n  <text x=\"10\" y=\"18\" class=\"hd\">synth_bench.py \u2014 three orthogonal knobs, so you learn which wall binds first</text>\n\n  <rect class=\"b1\" x=\"20\" y=\"40\" width=\"300\" height=\"150\" rx=\"5\"/>\n  <text x=\"32\" y=\"60\" class=\"hd\">--ballast N</text>\n  <text x=\"32\" y=\"80\" class=\"fld\">bytes UP, draw calls FLAT</text>\n  <text x=\"32\" y=\"100\" class=\"note\">duplicate arrays referenced by no item;</text>\n  <text x=\"32\" y=\"116\" class=\"note\">ArrayBundle uploads every descriptor,</text>\n  <text x=\"32\" y=\"132\" class=\"note\">only items reach a draw_indexed</text>\n  <text x=\"32\" y=\"158\" class=\"fld\">tests: wasm cap, upload, VRAM</text>\n  <text x=\"32\" y=\"176\" class=\"fld\">verified: 200x -&gt; 252 MiB, 8 draws</text>\n\n  <rect class=\"b2\" x=\"340\" y=\"40\" width=\"300\" height=\"150\" rx=\"5\"/>\n  <text x=\"352\" y=\"60\" class=\"hd\">--instances N</text>\n  <text x=\"352\" y=\"80\" class=\"fld\">draw calls UP, bytes ~FLAT</text>\n  <text x=\"352\" y=\"100\" class=\"note\">clone items with fresh transforms</text>\n  <text x=\"352\" y=\"116\" class=\"note\">(+64 B each), on a cubic lattice</text>\n  <text x=\"352\" y=\"158\" class=\"fld\">tests: draws + bind-group churn</text>\n  <text x=\"352\" y=\"176\" class=\"fld\">verified: 50x -&gt; 400 draws, +25 KB</text>\n\n  <rect class=\"b3\" x=\"660\" y=\"40\" width=\"300\" height=\"150\" rx=\"5\"/>\n  <text x=\"672\" y=\"60\" class=\"hd\">--split-items K</text>\n  <text x=\"672\" y=\"80\" class=\"fld\">draw calls UP, bytes IDENTICAL</text>\n  <text x=\"672\" y=\"100\" class=\"note\">cut each item's index-row range into</text>\n  <text x=\"672\" y=\"116\" class=\"note\">K items \u2014 same pixels, K x the draws</text>\n  <text x=\"672\" y=\"158\" class=\"fld\">tests: PURE draw-call overhead</text>\n  <text x=\"672\" y=\"176\" class=\"fld\">verified: 4x -&gt; 32 draws, same bytes</text>\n\n  <line class=\"axis\" x1=\"60\" y1=\"380\" x2=\"900\" y2=\"380\"/>\n  <text x=\"60\" y=\"400\" class=\"note\">1.3 MiB (seed)</text>\n  <text x=\"420\" y=\"400\" class=\"note\">~1 GB \u2014 expected wasm death zone (3x peak vs 4 GB cap)</text>\n  <text x=\"800\" y=\"400\" class=\"note\">100 GB target</text>\n  <line x1=\"470\" y1=\"360\" x2=\"470\" y2=\"386\" stroke=\"#b42318\" stroke-width=\"2\"/>\n  <line x1=\"880\" y1=\"360\" x2=\"880\" y2=\"386\" stroke=\"#9a6700\" stroke-width=\"2\"/>\n  <text x=\"60\" y=\"250\" class=\"hd\">Three walls to 100 GB, each ~2 orders of magnitude out</text>\n  <text x=\"60\" y=\"274\" class=\"fld\">1. network  \u2014 100 GB @ 100 Mbps = ~2.2 h, and the loader needs EVERY chunk before drawing</text>\n  <text x=\"60\" y=\"294\" class=\"fld\">2. residency \u2014 peak ~3x geometry in wasm32 (4 GB cap) =&gt; ~0.7-1.0 GB today; fixing it moves the wall to VRAM (8-24 GB)</text>\n  <text x=\"60\" y=\"314\" class=\"fld\">3. draw calls \u2014 ~1e5-1e6 elements at 1 draw each, no instancing, no culling</text>\n  <text x=\"60\" y=\"340\" class=\"note\">=&gt; 100 GB is not a tuning problem. Resident set must be decoupled from model size (tiling + LOD + eviction).</text>\n</svg>\n"}]}</script>
<script>
// Minimal markdown renderer: enough for these docs (headings, tables, code, lists, links,
// bold/italic/inline code, blockquotes, hr). Deliberately dependency-free so the page works
// offline from file://.
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, (m,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
}
function splitRow(line){
  return line.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
}
function render(md){
  const lines = md.split(/\r?\n/);
  let out=[], i=0;
  while(i<lines.length){
    const line = lines[i];
    if(/^```/.test(line)){
      let buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    if(/^\s*\|.*\|\s*$/.test(line) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const head = splitRow(line); i+=2;
      let rows=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(splitRow(lines[i++]));
      out.push('<table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>'
        + rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    let m;
    if((m = line.match(/^(#{1,6})\s+(.*)$/))){
      const lvl = m[1].length;
      out.push('<h'+lvl+'>'+inline(m[2])+'</h'+lvl+'>'); i++; continue;
    }
    if(/^\s*([-*_])\1{2,}\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
    if(/^\s*[-*]\s+/.test(line)){
      let items=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/,''));
      out.push('<ul>'+items.map(t=>'<li>'+inline(t)+'</li>').join('')+'</ul>');
      continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      let items=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+\.\s+/,''));
      out.push('<ol>'+items.map(t=>'<li>'+inline(t)+'</li>').join('')+'</ol>');
      continue;
    }
    if(/^\s*>\s?/.test(line)){
      let buf=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+inline(buf.join(' '))+'</blockquote>');
      continue;
    }
    if(!line.trim()){ i++; continue; }
    let buf=[];
    while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*[-*]\s|\s*\d+\.\s|\s*>|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return out.join('\n');
}

const payload = JSON.parse(document.getElementById('payload').textContent);
const content = document.getElementById('content');
const panes = {};

function addPane(id, htmlBody){
  const div = document.createElement('div');
  div.className = 'doc'; div.id = 'pane-'+id;
  div.innerHTML = htmlBody;
  content.appendChild(div);
  panes[id] = div;
}
payload.docs.forEach(d => addPane(d.id, render(d.md)));
payload.diagrams.forEach(d => addPane(d.id, '<h1>'+d.title+'</h1>'+d.svg));

function buildNav(target, entries){
  const box = document.getElementById(target);
  entries.forEach(e => {
    const a = document.createElement('a');
    a.href = '#'+e.id; a.textContent = e.title; a.dataset.id = e.id;
    box.appendChild(a);
  });
}
buildNav('doc-nav', payload.docs);
buildNav('diag-nav', payload.diagrams);

function show(id){
  Object.values(panes).forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
  (panes[id] || panes[payload.docs[0].id]).classList.add('active');
  content.scrollTop = 0; window.scrollTo(0,0);
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || payload.docs[0].id);
</script>
