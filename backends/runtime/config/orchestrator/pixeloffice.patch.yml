
# PixelOffice Custom Agent patch — mount product subagent providers for cross-CLI delegation.
# Requires the dsh product packages in the task profile (`$DSH_HOME/profiles/headless`, installed
# by `ensureDshProductSubagents`) — NOT in `$DSH_HOME` itself, which dsh never resolves from.
#
# These rows introduce *new* plugin ids, so they must sit under `insert:`. A bare top-level entry
# addresses an existing row by id; the composed tree silently drops one that matches nothing.
# Verify with: dsh --profile headless --patch <this file> --dump-config

- insert:
    - id: subagent-cursor
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: cursor
        command: agent
        args: ['acp']

    - id: subagent-gemini
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: gemini
        command: node
        args:
          - '/home/ubuntu/work/PixelCompany/backends/runtime/scripts/antigravity-acp-shim.mjs'

    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'

    - id: tool-subagent-cursor
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: cursor
        toolName: cursor_agent
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-gemini
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: gemini
        toolName: gemini_agent
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed
